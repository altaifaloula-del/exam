<title>مراجعة الأسئلة الطبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one question per screen, thumb-reachable decision bar at the bottom, numbered map for jumping.
   Tokens: paper/surface/ink neutrals tinted toward the teal brand; ok/fix/bad/note are status colours, separate from the brand. */
:root{
  --paper:#EBF0F0; --surface:#FFFFFF; --ink:#12262B; --muted:#57696E; --line:#D0DADB;
  --brand:#0A6B72; --brand-ink:#FFFFFF;
  --ok:#14734A; --ok-bg:#E2F3E9; --fix:#8F5400; --fix-bg:#FBEED4; --bad:#AE2A1E; --bad-bg:#FBE3E0; --note:#2B5A99; --note-bg:#E3ECF8;
  --focus:#0A6B72;
  --f:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1618; --surface:#152124; --ink:#E4EDEE; --muted:#8CA1A6; --line:#283A3E;
  --brand:#55C2C9; --brand-ink:#06282B;
  --ok:#5CCB92; --ok-bg:#12301F; --fix:#F0B45A; --fix-bg:#3A2A0C; --bad:#FF8F84; --bad-bg:#3E1714; --note:#8DB6F0; --note-bg:#15283F; --focus:#55C2C9; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1618; --surface:#152124; --ink:#E4EDEE; --muted:#8CA1A6; --line:#283A3E;
  --brand:#55C2C9; --brand-ink:#06282B;
  --ok:#5CCB92; --ok-bg:#12301F; --fix:#F0B45A; --fix-bg:#3A2A0C; --bad:#FF8F84; --bad-bg:#3E1714; --note:#8DB6F0; --note-bg:#15283F; --focus:#55C2C9; color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.app{max-width:760px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;min-height:100vh}
@supports (min-height:100dvh){.app{min-height:100dvh}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
h1{font-size:1.05rem;font-weight:600;margin:0;text-wrap:balance}
.tabs{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .m-ok{background:var(--ok)} .meter .m-fix{background:var(--fix)} .meter .m-bad{background:var(--bad)} .meter .m-note{background:var(--note)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
main{flex:1;padding-block:16px 24px;display:grid;gap:14px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;font-weight:500;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:transparent;line-height:1.7}
.chip.t{color:var(--fix);background:var(--fix-bg);border-color:transparent}
.chip.c{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.chip.g{color:var(--note);background:var(--note-bg);border-color:transparent}
.id{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.stem{font-size:1.2rem;line-height:1.75;font-weight:500;margin:0;text-wrap:pretty}
.stem-ar{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:12px;text-align:start;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.opt:hover{border-color:var(--muted)}
.opt .k{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.9rem;color:var(--muted)}
.opt .tag{font-size:.75rem;font-weight:600;white-space:nowrap}
.opt.prop{border-color:var(--ok);background:var(--ok-bg)}
.opt.prop .k{border-color:var(--ok);color:var(--ok)}
.opt.prop .tag{color:var(--ok)}
.opt.ok-sel .k{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.fix-sel{border-color:var(--fix);background:var(--fix-bg)}
.opt.fix-sel .k{background:var(--fix);border-color:var(--fix);color:var(--surface)}
.opt.fix-sel .tag{color:var(--fix)}
.opt.struck{opacity:.75;text-decoration:line-through;text-decoration-thickness:1px}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.why{margin:0;padding:12px 14px;border-radius:10px;background:var(--paper);font-size:.95rem;line-height:1.7}
.why b{display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.refs{display:grid;gap:6px;padding:0;margin:0;list-style:none}
.refs a{color:var(--brand);text-decoration-thickness:1px;text-underline-offset:3px;overflow-wrap:anywhere}
.tier{font-size:.78rem;color:var(--muted)}
details>summary{cursor:pointer;font-weight:500;color:var(--brand);padding-block:4px}
textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);resize:vertical}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
label.lab{font-weight:500;font-size:.9rem;display:grid;gap:6px}
.state{padding:10px 14px;border-radius:10px;font-weight:500;font-size:.95rem}
.state.ok{background:var(--ok-bg);color:var(--ok)} .state.fix{background:var(--fix-bg);color:var(--fix)} .state.bad{background:var(--bad-bg);color:var(--bad)} .state.note{background:var(--note-bg);color:var(--note)}
footer.bar{position:sticky;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.actions{display:grid;grid-template-columns:1fr 1fr 46px 46px;gap:8px}
.actions .primary{grid-column:1/-1}
.btn.ico{padding:0;min-width:46px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;font-weight:500;padding:4px 12px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.cell{min-height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)} .cell.fix{background:var(--fix-bg);border-color:var(--fix);color:var(--fix)} .cell.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)} .cell.note{background:var(--note-bg);border-color:var(--note);color:var(--note)}
.cell.cur{outline:3px solid var(--focus);outline-offset:1px}
.filters{display:grid;gap:10px}
.filters .group{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 14px;font-size:.88rem;font-weight:500}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--paper);border-radius:10px;padding:8px 4px;font-size:.8rem;color:var(--muted)}
.stats b{display:block;font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
pre.out{margin:0;max-height:220px;overflow:auto;background:var(--paper);border-radius:10px;padding:10px;font:400 .75rem/1.5 var(--mono);direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
.notice{padding:10px 14px;border-radius:10px;background:var(--note-bg);color:var(--note);font-size:.9rem}
.notice.warn{background:var(--fix-bg);color:var(--fix)}
.err{color:var(--bad);font-size:.88rem;margin:0}
[dir=auto]{unicode-bidi:plaintext}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
@media (min-width:600px){.actions{grid-template-columns:2fr 1fr 1fr 48px 48px}.actions .primary{grid-column:auto}}
</style>

ية (ومنها الجهاز الهضمي) والبيئة المستشفوية عبر أيدي الطاقم (Medscape)؛ عبارة «السبب الأول» غامضة، و«hospital care» (عدوى المستشفيات) الأقرب لكن «intestinal» مصدر ذاتي موثّق أيضًا.","src_disagrees":false,"refs":[{"t":"Burn Wound Infections - Medscape","u":"https://emedicine.medscape.com/article/213595-overview"}],"hash":"6729a6a7"},{"id":"Q0009","spec":"assistant","type":"mcq","lang":"mixed","q":"Which of the following is hormone released from Langerhans in pancreas?","qar":"أي مما يلي هو هرمون يفرز من النجرهانز في البنكرياس؟","options":["estrogen","progesterone","insulin","all above"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الإنسولين تفرزه خلايا بيتا في جزر لانغرهانز بالبنكرياس؛ الإستروجين والبروجسترون هرمونان مبيضيان.","src_disagrees":false,"refs":[{"t":"Pancreatic Islet - ScienceDirect Topics","u":"https://www.sciencedirect.com/topics/medicine-and-dentistry/pancreatic-islet"}],"hash":"71e90558"},{"id":"Q0010","spec":"assistant","type":"mcq","lang":"mixed","q":"about CPR chose the correct answer:","qar":"اختار الإجابة الصحيحة حول الإنعاش","options":["two breaths and 15 compression","one breaths and 15 compression","two breaths and 5 compression","one breaths and 15 compression"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"الخياران 1 و3 مكرّران ولا خيار يوافق الإرشادات الحالية (AHA/ERC: 30 ضغطة : نفَسان). نسبة 15:2 (نفَسان و15 ضغطة) من النسب القديمة قبل إرشادات 2005، أما «نفَس واحد و15 ضغطة» فليست نسبة معتمدة؛ فالأقرب الخيار 0 وفق الإرشادات القديمة.","src_disagrees":true,"refs":[{"t":"The changes in cardiopulmonary resuscitation guidelines: from 2000 to the present - PMC","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6944876/"}],"hash":"a45f8f02"},{"id":"Q0011","spec":"assistant","type":"mcq","lang":"mixed","q":"the chamber the receive oxygenated blood that is coming from the lung is:","qar":"الحجرة التي يتلقى فيها الدم المؤكسج القادم من الرئة هي","options":["left atrium","righ y":["general"],"note":"التعقيم الطبي (التقنية النظيفة) يقلل عدد الكائنات الدقيقة ويمنع انتشارها، وتعريفه في كتب التمريض يشمل الحد من العدد والنمو والانتقال؛ المرجع المسترجَع (موسوعي) يذكر خفض العدد ومنع الانتشار فقط ولم أصل لنص كتاب التمريض، لذا الثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Wikipedia: Asepsis (medical/clean asepsis reduces the number of organisms and prevents their spread)","u":"https://en.wikipedia.org/wiki/Asepsis"}],"hash":"229974dc"},{"id":"Q0069","spec":"assistant","type":"mcq","lang":"en","q":"Magnesium Sulfate is ordered per IV. Which of the following should prompt the note to refer to the obstetricians prior to administration of the drug?","qar":null,"options":["B/p=180/100","urine output is 40ml/h","RR=12b/m","Temperature 37c°"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"السؤال غامض: ضغط 180/100 في مدى شديد (≥160/110) ويستدعي تدخّلًا عاجلًا من الطبيب (خافض ضغط) — وهو الوحيد غير الطبيعي؛ أما إدرار 40 مل/س (≥30) وتنفس 12 (التوقّف عند \u003c12 عادةً) وحرارة 37 فمقبولة، وتختلف البروتوكولات في حدّ التنفس (بعضها \u003c16). لا علامة مصدر؛ أُرجّح الخيار الأول بثقة منخفضة.","src_disagrees":false,"refs":[{"t":"AAFP/ACOG PB 222: severe-range BP (>=160/110) needs timely intervention; monitor urine output, respiration, reflexes on MgSO4","u":"https://www.aafp.org/pubs/afp/issues/2019/1115/p649.html"},{"t":"USF Health: Magnesium Sulfate (urine output \u003c30 mL/h, respiratory depression, loss of DTRs)","u":"https://health.usf.edu/media/zdrpe3ja/magnesium_sulfate.pdf"},{"t":"StatPearls: Magnesium Sulfate","u":"https://www.ncbi.nlm.nih.gov/books/NBK554553/"}],"hash":"b5f2e5dc"},{"id":"Q0072","spec":"assistant","type":"mcq","lang":"en","q":"Which of the following may happen if the uterus becomes over stimulated by oxytogin during induction of labor?","qar":null,"options":["Weak contractions prolonged to more than 70 sec","Titanic contractions prolonged for more than 90 sec","Increased pain with bright red vaginal bleeding","Increased restlessness"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"فرط تنبيه الرحم بالأوكسيتوسين يسبب انقباضات قوية/مستمرة (tetanic/hypertonic) مع خطر ضائقة الجنين وتمزق الرحم؛ نشرة الدواء تذكر الانقباضات الشديدة أو المطوّلة (tetanic)، والرقم 90 ثانية يرد في ملاحظات تمريضية (مصدر ضعيف)؛ الانقباضات 'الضعيفة' ليست فرط تنبيه. (Titanic = tetanic خطأ إملائي).","src_disagrees":false,"refs":[{"t":"Drugs.com: Oxytocin prescribing information (hyperstimulation with hypertonic or prolonged tetanic contractions)","u":"https://www.drugs.com/pro/oxytocin.html"},{"t":"RNpedia: Induction of Labor (tonic contractions prolonged to more than 90 seconds) - weak source","u":"https://www.rnpedia.com/nursing-notes/maternal-and-child-nursing-notes/induction-labor/"}],"hash":"6e450008"},{"id":"Q0074","spec":"assistant","type":"mcq","lang":"en","q":"Which of the following is not a part of conceptus?","qar":null,"options":["Deciduas","amniotic fluid","fetus","membranes"],"ans":0,"status":"verified","conf":"medium","tier":"strong","why":["corrected"],"note":"الـ conceptus هو الجنين/الجنين المبكر مع ملحقاته (الأغشية، المشيمة، الحبل السري) أي كل ما نشأ من اللاقحة؛ أما السّاقط decidua فنسيج أمومي من بطانة الرحم وليس جزءًا منه، لذا هو المستثنى. علامة المصدر (السائل الأمنيوسي) غير مدعومة، وتعريف الـ conceptus يختلف بين المراجع لذا الثقة متوسطة.","src_disagrees":true,"refs":[{"t":"Wikipedia: Conceptus (embryo and its appendages, membranes, placenta, umbilical cord)","u":"https://en.wikipedia.org/wiki/Conceptus"},{"t":"StatPearls: Physiology, Placenta (decidua basalis constitutes the maternal component)","u":"https://www.ncbi.nlm.nih.gov/books/NBK538332/"}],"hash":"9127a739"},{"id":"Q0075","spec":"assistant","type":"mcq","lang":"mixed","q":"According to Salwa, her LMP is November 15, 2017, using the Naegle's ule what EDD?","qar":"نهايه الورقه التفاصيل","options":["August 22, 2018","August 18, 2018","July 22,2018","February 22, 2018"],"ans" ction"}],"hash":"deea6f3f"},{"id":"Q0144","spec":"assistant","type":"mcq","lang":"en","q":"All of the following are physical assessment techniques except:","qar":null,"options":["Inspection.","Percussion.","Puncturing.","Palpation"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"تقنيات الفحص الجسدي الأربع: المعاينة Inspection والجسّ Palpation والقرع Percussion والإصغاء Auscultation؛ والوخز/البزل Puncturing ليس منها.","src_disagrees":false,"refs":[{"t":"Health Assessment and Physical Examination - NurseKey (Potter & Perry)","u":"https://nursekey.com/health-assessment-and-physical-examination/"},{"t":"Physical examination - Wikipedia","u":"https://en.wikipedia.org/wiki/Physical_examination"}],"hash":"824c87c1"},{"id":"Q0145","spec":"assistant","type":"mcq","lang":"en","q":"All of the following are post procedural nursing responsibilities except:","qar":null,"options":["The nurse has to attend the patient for comfort and rest.","Care of specimens.","Assist the examiner.","Record and report of information."],"ans":2,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"مساعدة الفاحص (Assist the examiner) مهمة تمريضية أثناء الإجراء وليست بعده، أما راحة المريض ورعاية العينات والتسجيل والإبلاغ فمن مسؤوليات ما بعد الإجراء؛ استنتاج من المعيار التمريضي العام ولم أتمكن من فتح مرجع يؤكده.","src_disagrees":false,"refs":[],"hash":"795fafed"},{"id":"Q0148","spec":"assistant","type":"mcq","lang":"en","q":"Urine that remains in pt's bladder after he voids is called:","qar":null,"options":["Reflux urine","Over flow urine","Retention urine","Residual urine"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"البول المتبقي في المثانة بعد التبوّل يسمى البول المتبقي Residual urine (Post-void residual)؛ أما Retention فاحتباس بولي مرضي.","src_disagrees":false,"refs":[{"t":"Urinary retention - Wikipedia (post-void residual)","u":"https://en.wikipedia.org/wiki/Urinary_retention"}],"hash":"989e10f8"},{"id":"Q0151","spec":"assistant","type":"mcq","lang":"en","q":"Which of the following terms is used to indicate total urine out put of less than 50 ml in 24 hours:","qar":null,"options":["Anuria","Oliguria","Dysuria","Polyuria"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"قلّة البول (Oliguria) أقل من 400–500 مل/24 ساعة، أما انعدام البول (Anuria) فيُعرَّف في مراجع التمريض بأنه أقل من 50 مل/24 ساعة (وتعرّفه مراجع أخرى بأقل من 100 مل)؛ فالخيار الوحيد المطابق هو Anuria.","src_disagrees":false,"refs":[{"t":"OpenRN Nursing Fundamentals - Elimination Glossary (anuria: less than 50 mL/24 h)","u":"https://med.libretexts.org/Bookshelves/Nursing/Nursing_Fundamentals_(OpenRN)/16:_Elimination/16.12:_XVI_Glossary"},{"t":"Nursing Pass - Anuria (less than 100 mL/24 h; some sources use less than 50 mL)","u":"https://nursing-pass.com/glossary/anuria"}],"hash":"4307f968"},{"id":"Q0153","spec":"assistant","type":"mcq","lang":"en","q":"The name of the procedure for the removal of urinary bladder stone is:","qar":null,"options":["Cystolithiasis","Cystolithectomy","Cystometry","Cystoextraction"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"Cystolithectomy = استئصال حصاة المثانة (cysto مثانة + litho حصاة + ectomy استئصال)؛ أما Cystolithiasis فهو وجود الحصاة، وCystometry فحص ضغط المثانة. المصطلح الجراحي الأشيع في المراجع الحديثة هو cystolithotomy بنفس المعنى؛ لم أجد تعريفاً مقروءاً لـ cystolithectomy نفسها فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Merriam-Webster Medical - Cystolithotomy (surgical removal of a calculus from the urinary bladder)","u":"https://www.merriam-webster.com/medical/cystolithotomy"},{"t":"Cystolithotomy: Technique and Complications of Sectio Alta - Urology Textbook","u":"https://www.urology-textbook.com/cystolithotomy.html"}],"hash":"5033342d"},{"id":"Q0162","spec":"assistant","type":"mcq","lang":"en","q":"You should instruct the Pt. when taking Prothiasin:","qar":null,"options":["To take it after 2 hours of meal","To void after 2 hours","Not to drive his care","Don’t worry about vomiting"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"اسم الدواء مشوَّه؛ على الأرجح Prothiaden (دوسوليبين، مضاد اكتئاب ثلاثي الحلقات) الذي تنصّ نشرته على أنه يسبب النعاس وعدم القيادة حتى تُعرف الاستجابة. باقي الخيارات لا معنى سريرياً لها، لكن تحديد الدواء استنتاج.","src_disagrees":false,"refs":[{"t":"HPRA - Prothiaden 75 mg coated tablets: package leaflet (drowsiness, do not drive)","u":"https://assets.hpra.ie/products/Human/13809/d5652a5e-513c-42b8-a469-6a1291799634.pdf"}],"hash":"8f796160"},{"id":"Q0167","spec":"assistant","type":"mcq","lang":"en","q":"Urinary elimination process means:","qar":null,"options":["The process of re-absorption of water and minerals in the kidney.","The process of urine collection in the human bladder.","The process of releasing excess fluid and metabolic wastes.","The process of urine assessment by the lab technicians."],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الإخراج البولي (Urinary elimination) في التمريض هو عملية طرح السوائل الزائدة والفضلات الاستقلابية من الجسم؛ أما إعادة الامتصاص فجزء من فسيولوجيا الكلية، وجمع البول في المثانة تخزين لا إخراج.","src_disagrees":false,"refs":[{"t":"OpenRN Nursing Fundamentals - Elimination (body eliminates waste products through the urinary system)","u":"https://med.libretexts.org/Bookshelves/Nursing/Nursing_Fundamentals_(OpenRN)/16:_Elimination/16.01:_Elimination_Introduction"},{"t":"Wikipedia - Urination (main method of eliminating waste and excess fluid)","u":"https://en.wikipedia.org/wiki/Urination"}],"hash":"cf25eea2"},{"id":"Q0168","spec":"assistant","type":"mcq","lang":"en","q":"Measurement of the NGT as:","qar":null,"options":["From neck to nose to epigastric region.","From shoulder to nose to zephoid process.","From ear to nose to zephoid process.","From mouth to nose to zephoid process."], com/what-are-the-differences-between-intravenous-infusion-and-intravenous-bolus/"}],"hash":"ec2c5949"},{"id":"Q0183","spec":"assistant","type":"mcq","lang":"en","q":"11- All of the following are considered congenital a cyanotic heart disease Except:","qar":null,"options":["Ventricular septal defect (VSD)","Tricuspid atresia.","Coarctation of aorta","Patent ductus arterioses."],"ans":1,"status":"verified","conf":"high","tier":"strong","why":["corrected"],"note":"المصدر أشّر تضيّق الأبهر (2) وهو خطأ: الاستثناء المطلوب هو المرض الزرقي؛ رتق الصمام ثلاثي الشرفات (Tricuspid atresia) مرض قلبي خِلقي زرقي، بينما VSD وPDA وتضيّق الأبهر (Coarctation) لا زرقية.","src_disagrees":true,"refs":[{"t":"CDC - Tricuspid Atresia (causes cyanosis; critical CHD)","u":"https://www.cdc.gov/heart-defects/about/tricuspid-atresia.html"},{"t":"Wikipedia - Congenital heart defect (VSD, PDA, coarctation non-cyanotic; tricuspid atresia cyanotic)","u":"https://en.wikipedia.org/wiki/Congenital_heart_defect"},{"t":"CDC - Coarctation of the Aorta (symptoms do not include cyanosis)","u":"https://www.cdc.gov/heart-defects/about/coarctation-of-the-aorta.html"}],"hash":"70e9463a"},{"id":"Q0187","spec":"assistant","type":"mcq","lang":"en","q":"A full-term pregnancy normally ranges between:","qar":null,"options":["37-40","38-42","38-44","36-40"],"ans":0,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"التعريفات تختلف: ACOG يجعل الحمل 'كامل المدة' 39+0 إلى 40+6 أسبوع، ومنظمة الصحة العالمية تعدّ 'الحمل التام' من 37 أسبوعاً (قبلها خديج) إلى أقل من 42، وبعض كتب التمريض تذكر 38–42 (الخيار 1) وأخرى 37–40؛ لا خيار يطابق ACOG تماماً. أبقيت على 37–40 (علامة المصدر) بثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Wikipedia - Gestational age (ACOG term definitions; 38-42 weeks normal; WHO preterm \u003c37 weeks)","u":"https://en.wikipedia.org/wiki/Gestational_age"}],"hash":"7a6d108e"},{"id":"Q0191","spec":"assistant","type":"mcq","lang":"en","q":"When the foetus is growing inside the uterus it needs nutrients. What provides these nutrients?","qar":null,"options":["Placenta","Amniotic sac","Uterus","Oviduct"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"المشيمة تمدّ الجنين بالمغذيات والأكسجين وتزيل الفضلات عبر تبادل بين الدورتين الدمويتين للأم والجنين.","src_disagrees":false,"refs":[{"t":"Wikipedia - Placenta","u":"https://en.wikipedia.org/wiki/Placenta"}],"hash":"d6e0382d"},{"id":"Q0193","spec":"assistant","type":"mcq","lang":"en","q":"HCG is an acronym for what?","qar":null,"options":["Human cloning gene","Human cell gamete","Human chorionic gonadotropin","Human corpus growth"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"HCG = Human chorionic gonadotropin (الهرمون المحفّز للغدد التناسلية المشيمائي).","src_disagrees":false,"refs":[{"t":"Wikipedia - Human chorionic gonadotropin","u":"https://en.wikipedia.org/wiki/Human_chorionic_gonadotropin"}],"hash":"46e68071"},{"id":"Q0194","spec":"assistant","type":"mcq","lang":"en","q":"The family structure consisting of parents and their dependent children living together is known as a(n):","qar":null,"options":["Binuclear family","Reconstituted family","Nuclear family","Extended family"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الأسرة النووية (Nuclear family) = الوالدان وأبناؤهما المعالون يعيشون معاً.","src_disagrees":false,"refs":[{"t":"Wikipedia - Nuclear family","u":"https://en.wikipedia.org/wiki/Nuclear_family"}],"hash":"24a1a91e"},{"id":"Q0196","spec":"assistant","type":"mcq","lang":"en","q":"The patient lying face down is called:","qar":null,"options":["Supine","Prone","Fowler's","Lateral"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الوضعية البطنية (Prone) = الاستلقاء على الوجه/الصدر للأسفل؛ أما Supine فعلى الظهر.","src_disagrees":false,"refs":[{"t":"Wikipedia - Prone position","u":"https://en.wikipedia.org/wiki/Prone_position"}],"hash":"cbdd94be"},{"id":"Q0201","spec":"assistant","type":"mcq","lang":"en","q":"Pregnancy Lasts on average","qar":null,"options":["280 days from last period","37 weeks","42 weeks","40 weeks","a & c"],"ans":4,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"الحمل الطبيعي ≈ 280 يومًا = 40 أسبوعًا من أول يوم لآخر دورة (Cleveland Clinic)؛ الخيار الجامع «a & c» يُقصد به غالبًا «280 يومًا + 40 أسبوعًا»، لكن بترتيب الخيارات المنقول صار c = 42 أسبوعًا (post-term) والـ40 أسبوعًا هو d، فحرفيًا لا يصح؛ السؤال يحتاج مراجعة ترتيب الخيارات.","src_disagrees":false,"refs":[{"t":"Cleveland Clinic - Pregnancy: Gestation, Trimesters (pregnancy lasts ~40 weeks = 280 days; full term 39w0d-40w6d; post-term after 42 weeks)","u":"https://my.clevelandclinic.org/health/articles/pregnancy"}],"hash":"e09a60f6"},{"id":"Q0204","spec":"assistant","type":"mcq","lang":"en","q":"When will the baby first recognize his mother visually?","qar":null,"options":["From birth","3 to 4 weeks","3 to 4 months","6 to 8 months"],"ans":1,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"الدراسات تُظهر تفضيل حديثي الولادة لوجه الأم خلال أيام (Pascalis: متوسط 78 ساعة) وبعض المصادر العامة تقول بعد أسابيع/شهرين؛ لم أجد مرجعًا تمريضيًا حاسمًا لـ«3–4 أسابيع»، و«منذ الولادة» غير دقيق حرفيًا، فـ«3–4 أسابيع» الأقرب من الخيارات مع بقاء الشك.","src_disagrees":false,"refs":[{"t":"Pascalis et al. 1995 - Mother's face recognition by neonates (preference shown at mean age 78 hours)","u":"https://johnmorton.co.uk/wp-content/uploads/2014/11/1995-pascalis.pdf"},{"t":"Wikipedia - Infant visual development (newborn discrimination of mother's face: days to ~2 weeks)","u":"https://en.wikipedia.org/wiki/Infant_visual_development"},{"t":"Pathways.org - When does baby recognize faces (lay source: ~2 months)","u":"https://pathways.org/when-does-baby-recognize-faces"}],"hash":"5417d225"},{"id":"Q0206","spec":"assistant","type":"mcq","lang":"en","q":"You're most fertile when one o :"general","why":["general"],"note":"قلة البول (Oliguria) = أقل من 400–500 مل/24 ساعة عند البالغ؛ الانعدام (anuria) أقل من 80–100 مل، وكثرة البول (polyuria) عكسها.","src_disagrees":false,"refs":[{"t":"Wikipedia - Oliguria (adult \u003c400 or \u003c500 mL/24h; cites Merck)","u":"https://en.wikipedia.org/wiki/Oliguria"}],"hash":"25cd7037"},{"id":"Q0215","spec":"assistant","type":"mcq","lang":"en","q":"Mr. Harvey, age 54, is admitted with a diagnosis of congestive heart failure secondary to chronic obstructive pulmonary disease [COPD]. the physician orders sublingual nitroglycerin 0.4 mg PRN, for chest pain, while administering the nitroglycerin, the nurse should :","qar":null,"options":["tell Mr. Harvey to hold the tablet under his tongue and let it dissolve.","tell Mr. Harvey to swallow the tablet with water.","apply nitroglycerin ointment to Mr. Harvey's chest.","mix the nitroglycerin with applesauce for Mr. Harvey to eat"],"ans":0,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"النيتروغليسرين تحت اللسان يُوضع تحت اللسان ويُترك ليذوب ولا يُبلع (تعليمات الدواء القياسية)؛ الخيارات الأخرى (بلع/مرهم/مزج بالطعام) طرق إعطاء مختلفة؛ لم أتمكّن من فتح مرجع رسمي لهذه الجلسة فالثقة منخفضة شكليًا.","src_disagrees":false,"refs":[],"hash":"a5fb70e9"},{"id":"Q0216","spec":"assistant","type":"mcq","lang":"en","q":"The first nursing intervention should be done in the re covery room is:","qar":null,"options":["give the patient analgesics","take vital signs and record","put the patient in recovery position","do suction to the airway"],"ans":2,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"أولوية الإفاقة هي الحفاظ على مجرى الهواء (ASA: مراقبة الأكسجة والتهوية أولًا) ووضعية الإفاقة الجانبية تُبقي المجرى مفتوحًا وتصرّف السوائل؛ أما الشفط فيُجرى عند وجود إفرازات، والعلامات الحيوية والمسكّن تأتي بعد تأمين المجرى؛ لا يوجد مرجع يحدد «أول تدخل» بين الخيارين 2 و3 فالحسم ضعيف.","src_disagrees":false,"refs":[{"t":"ASA - Standards for Po us.gov/ency/article/000039.htm"}],"hash":"2af8c1da"},{"id":"Q0345","spec":"assistant","type":"mcq","lang":"en","q":"Subastance abuse mean:","qar":null,"options":["physiological changes of aging.","Subastance toxic.","Subastance that the person addiction."],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"إساءة استخدام المواد هي استعمال مادة (مؤثرة نفسياً) بكميات/طرق ضارة تقود غالباً إلى الإدمان؛ الخيار 2 («المادة التي يدمنها الشخص») هو الأقرب رغم ركاكة الصياغة، والآخران (تغيّرات الشيخوخة، مادة سامة) خاطئان.","src_disagrees":false,"refs":[{"t":"Substance abuse / misuse - Wikipedia","u":"https://en.wikipedia.org/wiki/Substance_abuse"}],"hash":"1059252e"},{"id":"Q0348","spec":"assistant","type":"mcq","lang":"ar","q":"عند إدخال NGT للمريض وواجهت مقاومه عند إدخال الأنبوب ماذا يجب على الممرض أن يعمل:","qar":null,"options":["يستمر في تحريك الأنبوب الى الأسفل.","اسحب الأنبوبة بمعنى أخرجها","يسحبها قليلاً للوراء ثم يحاول إدخالها مرة أُخرى."],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"عند مقاومة أثناء إدخال الأنبوب الأنفي المعدي لا يُدفَع بالقوة؛ يُسحب قليلاً ويُعاد توجيهه/تدويره ثم تُكرَّر المحاولة (Medscape: عند مقاومة كبيرة يُوقَف التقدّم ويُسحب الأنبوب ويُعاد التوجيه). الاستمرار في الدفع خاطئ.","src_disagrees":false,"refs":[{"t":"Medscape - Nasogastric Intubation: Technique","u":"https://emedicine.medscape.com/article/80925-technique"}],"hash":"9ac7acfe"},{"id":"Q0349","spec":"assistant","type":"mcq","lang":"en","q":"Giving the patient medication immediately and only once is:","qar":null,"options":["Single order.","Standing order.","As needed order.","Stat order."],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"أمر Stat هو أمر لمرة واحدة يُنفَّذ فوراً/بأسرع وقت ممكن (OpenStax Clinical Nursing Skills: «a one-time order that is administered as urgently as possible»)، بخلاف الأمر الفردي/لمرة واحدة بوقت مجدول، والأمر الدائم، والأمر عند اللزوم PRN؛ فالإجابة conf":"medium","tier":"strong","why":["corrected"],"note":"مطرقة الانعكاسات (percussion/reflex hammer ذات الرأس المطاطي) تُستعمل لإثارة المنعكسات الوترية العميقة (استجابة حركية) وليس لفحص الحس الذي يُفحص باللمس الخفيف/الوخز/الشوكة الرنانة؛ المصدر الجديد يعلّم «صح» لكن المراجع لا تدعمه، فالإجابة «خطأ» (النص مبتور قليلًا فالثقة متوسطة).","src_disagrees":true,"refs":[{"t":"StatPearls (NCBI Bookshelf) - Physiology, Deep Tendon Reflexes","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK562238/"},{"t":"Wikipedia - Reflex hammer","u":"https://en.wikipedia.org/wiki/Reflex_hammer"}],"hash":"61109191"},{"id":"Q0660","spec":"assistant","type":"mcq","lang":"en","q":"The nurse is inserting a nasogastric tube in an adult client. During the procedure, the client begins to cough and has difficulty breathing. What is the most appropriate action?","qar":null,"options":["Insert the tube quickly.","Notify the health care provider immediately.","Remove the tube and reinsert it when the respiratory distress subsides.","Pull back on the tube and wait until the respiratory distress subsides."],"ans":2,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"سعال وصعوبة تنفس أثناء إدخال الأنبوب الأنفي المعدي يعنيان احتمال دخوله القصبة فيُسحَب الأنبوب (Glasgow وOpenTextBC وNursingEducation) ويُعاد إدخاله بعد استقرار التنفس؛ أحد المراجع (WTCS) يكتفي بسحبه للخلف حتى يعود التنفس طبيعيًا وهو أقرب للخيار الأخير، فالمراجع لا تتطابق تمامًا — أرجّح «Remove and reinsert» بثقة منخفضة.","src_disagrees":false,"refs":[{"t":"University of Glasgow - Nasogastric Tube Insertion Clinical Skills Guidance","u":"https://www.gla.ac.uk/media/Media_678213_smxx.pdf"},{"t":"Clinical Procedures for Safer Patient Care (BCcampus) - Nasogastric Tubes","u":"https://opentextbc.ca/clinicalskills/chapter/10-2-nasogastric-tubes/"},{"t":"Nursing Advanced Skills (WTCS Pressbooks) - Checklist: Insert a Nasogastric Tube","u":"https://wtcs.pressbooks.pub/nursingadvancedskills/chapter/5-4-checklist-inserting-a-nasogastric-tube/"},{"t":"Nursing Education - NG tube insertion question","u":"https://nursingeducation.org/lms/questions/view/1025"}],"hash":"5ceba3ee"},{"id":"Q0661","spec":"assistant","type":"mcq","lang":"en","q":"During the healing phase of inflammation, which cells would most likely to regenerate :","qar":null,"options":["Skin.","Neurons.","Cardiac muscle.","Skeletal muscle."],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"في مرحلة الالتئام تتجدد الخلايا «اللابلة» (labile) كظهارة الجلد بقدرة كبيرة، أما العصبونات وخلايا عضلة القلب والعضلات الهيكلية فخلايا «دائمة» قدرتها على التجدد ضئيلة وتُرمَّم بالندبة (ScienceDirect Topics)؛ فالجلد هو الأكثر تجددًا.","src_disagrees":false,"refs":[{"t":"ScienceDirect Topics - Tissue Regeneration","u":"https://www.sciencedirect.com/topics/medicine-and-dentistry/tissue-regeneration"}],"hash":"ae12ec0e"},{"id":"Q0665","spec":"assistant","type":"tf","lang":"en","q":"Blister is most common occurs is fourth stage","qar":null,"options":["True","False"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"لم تُحدَّد أي «مراحل»: في قرحة الضغط يظهر التفقّع (blister) في المرحلة الثانية (NPIAP) أما الرابعة ففقدان كامل السماكة مع انكشاف العضلة/العظم؛ وفي الحروق يرتبط التفقّع بالدرجة الثانية — فالعبارة خطأ في القراءتين.","src_disagrees":false,"refs":[{"t":"NPIAP - Pressure Injury Stages","u":"https://cdn.ymaws.com/npiap.com/resource/resmgr/online_store/npiap_pressure_injury_stages.pdf"},{"t":"OpenStax Clinical Nursing Skills - 8.1 Wound Classification","u":"https://openstax.org/books/clinical-nursing-skills/pages/8-1-wound-classification"}],"hash":"75b38e76"},{"id":"Q0672","spec":"assistant","type":"mcq","lang":"en","q":"The client is complaining of shortness of breath. His respirations are 28 and labored. The bed is currently in the flat position. The nurse puts the bed in which position?","qar":null,"options":["Fowler's","Semi-Fowler's","Trendelenburg","Reverse Trendelenburg"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"في ضيق التنفس يُرفع رأس السرير لزيادة تمدد الصدر: Fowler (٤٥–٦٠°) وHigh Fowler (٦٠–٩٠°) للضائقة التنفسية، أما Semi-Fowler (٣٠–٤٥°) فأخفّ؛ فالأنسب بين الخيارات Fowler، وTrendelenburg لا يُستعمل لتسهيل التنفس؛ الفرق بين Fowler وSemi-Fowler يعتمد على تعريف الزوايا فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Wikipedia - Fowler's position","u":"https://en.wikipedia.org/wiki/Fowler%27s_position"},{"t":"Fundamentals of Nursing - Patient Positions (LevelUpRN)","u":"https://leveluprn.com/blogs/fundamentals-of-nursing/principles-10-patient-positions"}],"hash":"69e66f22"},{"id":"Q0673","spec":"assistant","type":"mcq","lang":"en","q":"The first step in clinical intervention for patient with diabetes coma:","qar":null,"options":["insert IV cannula and start glucose 10% infusion","Insert urine catheter","check blood sugar.","Give the patient oxygen therapy"],"ans":2,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"المراجع تختلف: StatPearls للتمريض يذكر تأمين وريد وإعطاء دكستروز/جلوكاجون لفاقد الوعي المشتبه بنقص السكر، وBetter Health تبدأ باستدعاء الإسعاف ووضع الإفاقة، وStatPearls (فرط السكر) يبدأ بفحوص أولها الغلوكوز؛ وغيبوبة «السكري» قد تكون نقص أو فرط سكر فقياس سكر الدم أول خطوة لتحديد العلاج — أرجّح «check blood sugar» بثقة منخفضة (إن ثبت نقص السكر فالخيار الأول مقبول).","src_disagrees":false,"refs":[{"t":"StatPearls (NCBI Bookshelf) - Hypoglycemia (Nursing)","u":"https://www.ncbi.nlm.nih.gov/books/NBK568695/"},{"t":"StatPearls (NCBI Bookshelf) - Hyperglycemia","u":"https://www.ncbi.nlm.nih.gov/books/NBK430900/"},{"t":"Better Health Channel (Victoria) - Diabetic coma","u":"https://www.betterhealth.vic.gov.au/health/conditionsandtreatments/diabetic-coma"}],"hash":"79406637"},{"id":"Q0677","spec":"assistant","type":"mcq","lang":"en","q":"The client is in surgery and will be returning to his bed via a stretcher. Which bed option reflects that the nurse appropriately planned ahead for this client?","qar":null,"options":["Open bed in low position","Closed bed in high position","Occupied bed in low position","Surgical bed in high position"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"السرير الجراحي (surgical/postoperative bed) يُترك في الوضع المرتفع ليوازي النقّالة ويسهّل نقل المريض منها مع إبعاد الأثاث (Brookside Press: Leave the bed in the high position)؛ السرير المفتوح/المغلق/المشغول ليس السرير المخصص للعائد من العمليات. مرجع تعليمي عام فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Brookside Press - Nursing Fundamentals I: Methods of Bed-Making","u":"https://brooksidepress.org/nursing_fundamentals_1/?page_id=280"}],"hash":"5055f170"},{"id":"Q0679","spec":"assistant","type":"tf","lang":"en","q":"Touch or feel considered by palpation","qar":null,"options":["True","False"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الجس (palpation) هو الفحص بالملامسة/اللمس (touch/feel) باليدين والأصابع وهو أحد مكونات الفحص السريري — صح (مراجع تعليمية عامة فالثقة متوسطة).","src_disagrees":false,"refs":[{"t":"Techniques of Physical Assessment (Pressbooks chapter)","u":"https://pressbooks.pub/raquelbertiz1969/chapter/chapter-4-techniques-of-physical-assessment/"},{"t":"Wikipedia - Physical examination","u":"https://en.wikipedia.org/wiki/Physical_examination"},{"t":"Wikipedia - IPPA (Inspection, Palpation, Percussion, Auscultation)","u":"https://en.wikipedia.org/wiki/IPPA"}],"hash":"ce4e4d4c"},{"id":"Q0682","spec":"assistant","type":"mcq","lang":"en","q":"The medical's assistant lists Lymph Node's by Technique Palpation how it is done","qar":null,"options":["Touch the neck and Head and back.","Pressure or touch by fingers and between fingers.","Can be done by the client.","It is not influenced by drug."],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"من الخيارات الأربعة الوحيد الذي يصف تقنية جس العقد اللمفية هو «ضغط أو لمس بالأصابع» (وسادات 2–3 أصابع بضغط خفيف وحركة دائرية)؛ أما «لمس الرقبة والرأس والظهر» فمواضع لا تقنية (ولا عقد بالظهر) و«يمكن أن يتم بواسطة العميل» و«لا يتأثر بالدواء» عبارتان غير وصفيتين. ثقة متوسطة لأن صياغة السؤال عامة.","src_disagrees":false,"refs":[{"t":"10.7 Inspection and Palpation of the Lymph Nodes (nursing physical assessment open textbook)","u":"https://cod.pressbooks.pub/nursingphysicalassessment/chapter/inspection-and-palpation-of-the-lymph-nodes/"},{"t":"Techniques of Physical Assessment: NCLEX-RN (registerednursing.org)","u":"https://www.registerednursing.org/nclex/techniques-physical-assessment/"}],"hash":"4f83a486"},{"id":"Q0683","spec":"assistant","type":"mcq","lang":"en","q":"Which clinical intervention is the highest in priority for a client at risk for falls in a hospital setting :","qar":null,"options":["Review prescribed medications.","Keep all of the side rails up.","complete the \"get up and go test.","Place the bed in the lowest position."],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"أعلى أولوية فورية لخطر السقوط في المستشفى: خفض السرير لأدنى مستوى لتقليل الإصابة عند السقوط؛ رفع الحواجز الجانبية كلها قد يزيد خطر الإصابة ويُعدّ تقييداً، ومراجعة الأدوية واختبار «Get up and go» تقييمات لا تحمي فوراً. مصدر الإجابة الأساسي كتاب تمريض مفتوح ومنصة تعليمية (ثقة متوسطة).","src_disagrees":false,"refs":[{"t":"BCcampus Clinical Procedures for Safer Patient Care - Fall Prevention","u":"https://opentextbc.ca/clinicalskills/chapter/3-7-fall-prevention/"},{"t":"Brainly - highest priority intervention for client at risk for falls (quiz site, weak)","u":"https://brainly.com/question/38683385"}],"hash":"cb41610c"},{"id":"Q0684","spec":"assistant","type":"mcq","lang":"en","q":"In the first trimester of pregnancy the vaccination to avoid :-","qar":null,"options":["Rubella.","Polio","Measles.","Small pox."],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"اللقاحات الحيّة المخفَّفة (الحصبة الألمانية/MMR، الحصبة، الجدري، الحماق) ممنوعة في الحمل؛ فالخيارات الأول والثالث والرابع كلها ممنوعة نظرياً، بينما شلل الأطفال المعطَّل IPV لا يُمنع لكن يُتجنَّب من حيث المبدأ. أشهر إجابة تعليمية هي الحصبة الألمانية (خطر متلازمة الحصبة الألمانية الخلقية) لذا رُجِّح الخيار 0 بثقة منخفضة لأن السؤال لا يملك إجابة وحيدة دقيقة.","src_disagrees":false,"refs":[{"t":"CDC - Guidelines for Vaccinating Pregnant Persons","u":"https://www.cdc.gov/vaccines/pregnancy/hcp-toolkit/guidelines.html"}],"hash":"60fdf4ca"},{"id":"Q0686","spec":"assistant","type":"mcq","lang":"en","q":"When entering the patient's ngt and facing resistance when inserting the tube, what should the nurse work?","qar":null,"options":["Continue moving the tube down","Pull out the tube, meaning take it out","Pull out the tube and put it back","He pulls it a little"],"ans":2,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"عند مقاومة أثناء إدخال الأنبوب الأنفي المعدي لا يُدفع بالقوة: OpenTextBC وWTCS يوصيان بسحب الأنبوب وإراحة المريض ثم إعادة المحاولة (غالبًا من الفتحة الأخرى)، وGlasgow توقف الإجراء وتُبلغ المختص؛ فالخيارات (سحبه) و(سحبه وإعادته) و(سحبه قليلًا) كلها قريبة — أرجّح «Pull out the tube and put it back» بثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Clinical Procedures for Safer Patient Care (BCcampus) - Nasogastric Tubes","u":"https://opentextbc.ca/clinicalskills/chapter/10-2-nasogastric-tubes/"},{"t":"Nursing Advanced Skills (WTCS Pressbooks) - Checklist: Insert a Nasogastric Tube","u":"https://wtcs.pressbooks.pub/nursingadvancedskills/chapter/5-4-checklist-inserting-a-nasogastric-tube/"},{"t":"University of Glasgow - Nasogastric Tube Insertion Clinical Skills Guidance","u":"https://www.gla.ac.uk/media/Media_678213_smxx.pdf"}],"hash":"37362af4"},{"id":"Q0690","spec":"assistant","type":"tf","lang":"en","q":"External bleeding is more dangerous than internal bleeding","qar":null,"options":["True","False"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"النزف الداخلي قد لا يظهر فيتأخر اكتشافه وقد يهدد الحياة فيُعامل كطارئ (Red Cross)، فالقول إن النزف الخارجي أخطر من الداخلي غير صحيح كقاعدة — خطأ؛ لا مرجع يقارن بينهما صراحةً فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"American Red Cross - Bleeding (Life-Threatening Internal)","u":"https://www.redcross.org/take-a-class/resources/learn-first-aid/bleeding-life-threatening-internal"}],"hash":"0824f781"},{"id":"Q0696","spec":"assistant","type":"tf","lang":"en","q":"When someone is choking, you should perform the Heimlich maneuver the right away.","qar":null,"options":["True","False"],"ans":1,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"العبارة مطلقة: الإرشادات (Merck) تقول تُجرى المناورة فقط عند الانسداد الشديد (لا يستطيع الكلام/السعال/التنفس) أما إن كان يسعل ويتكلم فيُشجَّع على السعال دون مناورة؛ لذا «فوراً» لكل مختنق غير دقيقة فتُرجَّح خطأ، لكن إن قُصد بالاختناق الانسداد التام فالعبارة صحيحة — ثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Merck Manual Professional - Abdominal thrusts and back blows in the conscious choking adult/child","u":"https://www.merckmanuals.com/professional/critical-care-medicine/how-to-do-basic-airway-procedures/how-to-do-abdominal-thrusts-and-back-blows-in-the-conscious-adult-or-child-who-is-choking"}],"hash":"5a4b4a21"},{"id":"Q0697","spec":"assistant","type":"tf","lang":"en","q":"Nerve cell and fibers act as a motor unit.","qar":null,"options":["True","False"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"صحيح بالمعنى التعليمي: الوحدة الحركية Motor Unit = عصبون حركي واحد (خليته وليفه العصبي) مع كل الألياف العضلية التي يعصّبها؛ صياغة العبارة مختصرة (الألياف هنا العضلية).","src_disagrees":false,"refs":[{"t":"Medicine LibreTexts (Boundless A&P) - Overview of Motor Integration (motor unit)","u":"https://med.libretexts.org/Bookshelves/Anatomy_and_Physiology/Anatomy_and_Physiology_(Boundless)/12:_Peripheral_Nervous_System/12.8:_Motor_Activity/12.8B:_Overview_of_Motor_Integration"}],"hash":"22b4f8f5"},{"id":"Q0698","spec":"assistant","type":"tf","lang":"en","q":"Capillary bleeding is slow and oozing.","qar":null,"options":["True","False"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"صحيح: النزف الشعيري بطيء وراشح (رشح من سطح الجرح) وأخف أنواع النزف ويتوقف غالباً من تلقاء نفسه، بخلاف الوريدي المستمر الداكن والشرياني النابض.","src_disagrees":false,"refs":[{"t":"Medical News Today - Types of bleeding","u":"https://www.medicalnewstoday.com/articles/types-of-bleeding"},{"t":"iMedic - Bleeding types and first aid","u":"https://imedic.health/en/first-aid/wounds-bruises/bleeding-types-treatment"}],"hash":"6036ed6c"},{"id":"Q0705","spec":"assistant","type":"tf","lang":"en","q":"The vein is characterized by being slow.","qar":null,"options":["True","False"],"ans":0,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"الصياغة مشوّهة (source_typo)؛ بفرض أن المقصود جريان الدم/النزف الوريدي: فهو مستمر وبطيء نسبياً داكن اللون وبضغط منخفض مقارنة بالشرياني النابض، فتُرجَّح «صحيح» بثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Healthline - Venous bleeding","u":"https://www.healthline.com/health/venous-bleeding"},{"t":"Medical News Today - Types of bleeding","u":"https://www.medicalnewstoday.com/articles/types-of-bleeding"}],"hash":"ec701a90"},{"id":"Q0708","spec":"assistant","type":"mcq","lang":"en","q":"Purposes of measuring pulse in the radial artery and apical include:","qar":null,"options":["Pulse changes with position","Unconscious victim","Detecting dysrhythmias","Pulse check in children"],"ans":2,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"مقارنة النبض الكعبري بالقمي (apical-radial) تكشف عجز النبض واضطراب النظم (Nurseslabs: النبض القمي مهم عند عدم انتظام النظم كالرجفان الأذيني، وعجز النبض يدل على اضطراب نظم أو نقص النتاج)، فالأنسب «كشف اضطرابات النظم» (الخيار 2)؛ وفاقد الوعي يُفحص نبضه السباتي (الطوارئ)، لكن خياري «تغيّر النبض مع الوضع» و«النبض عند الأطفال» قد يُعدّان من الأغراض في بعض المناهج، فالثقة منخفضة والمصدر تعليمي.","src_disagrees":false,"refs":[{"t":"Vital Signs: Pulse - Nurseslabs","u":"https://nurseslabs.com/vital-signs-pulse/"}],"hash":"2a9394fb"},{"id":"Q0709","spec":"assistant","type":"mcq","lang":"en","q":"Vitals to report for a 38-year-old (Temp 37.5°C, RR 30 b/min):","qar":null,"options":["RR only","Temp only","Temp + RR (Temp range: 36.5°C – 37.3°C)","Pulse + Temp"],"ans":2,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"معدل التنفس 30 غير طبيعي قطعاً (الطبيعي 12–20)؛ أما الحرارة 37.5 فوفق نطاق الخيار نفسه (36.5–37.3) تُعدّ مرتفعة قليلاً فالإجابة «حرارة + تنفس»، لكن StatPearls يجعل الحد الأعلى الطبيعي 37.5 (فيصبح «التنفس فقط» لو اعتُمد) — تختلف المراجع فالثقة منخفضة.","src_disagrees":false,"refs":[{"t":"StatPearls - Vital Signs (normal adult ranges)","u":"https://www.ncbi.nlm.nih.gov/books/NBK553213/"}],"hash":"60ba273a"},{"id":"Q0715","spec":"assistant","type":"mcq","lang":"en","q":"The primary nursing goal in treating myocardial infarction (MI) is to:","qar":null,"options":["Prevent blood loss","Decrease blood pressure","Relieve pain"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الهدف التمريضي الأول في احتشاء عضلة القلب هو تخفيف الألم الصدري (موازنة إمداد الأكسجين بالطلب) لأن الألم يزيد الحمل القلبي؛ الخيارات الأخرى (منع النزف، خفض الضغط) ليست الهدف الأساسي. الخيارات مقطوعة في النقل (قد توجد خيارات مثل الأكسجة) لذا الثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Nursing Process: The Patient With Myocardial Infarction (Brunner & Suddarth excerpt, Brainkart)","u":"https://www.brainkart.com/article/Nursing-Process--The-Patient-With-Myocardial-Infarction_31910/"},{"t":"Nurseslabs - Myocardial Infarction nursing care plans","u":"https://nurseslabs.com/myocardial-infarction-heart-attack-nursing-care-plans/"},{"t":"OpenStax Medical-Surgical Nursing - 12.5 Myocardial Infarction","u":"https://openstax.org/books/medical-surgical-nursing/pages/12-5-myocardial-infarction"}],"hash":"e6860d99"},{"id":"Q0716","spec":"assistant","type":"mcq","lang":"en","q":"Cause of pain in patients with myocardial infarction is:","qar":null,"options":["Cardiac cell death","Decrease cardiac output"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"ألم الاحتشاد ينتج عن عدم توازن الأكسجين (نقص التروية الإقفاري) ثم موت خلايا العضلة القلبية؛ وبين الخيارين المتاحين فإن «موت الخلايا القلبية» أقرب من «انخفاض النتاج القلبي»، لكن خيارات السؤال مقطوعة (قد يكون الخيار الصحيح «نقص التروية/الأكسجين») فالثقة منخفضة.","src_disagrees":false,"refs":[{"t":"StatPearls - Acute Myocardial Infarction","u":"https://www.ncbi.nlm.nih.gov/books/NBK459269/"},{"t":"Nurseslabs - Myocardial Infarction nursing care plans","u":"https://nurseslabs.com/myocardial-infarction-heart-attack-nursing-care-plans/"}],"hash":"79cd2c91"},{"id":"Q0561","spec":"nursing","type":"mcq","lang":"en","q":"Nurse Jenny is instilling an otic solution into an adult male client left ear. Nurse Jenny avoids doing which of the following as part of the procedure","qar":null,"options":["Pulling the auricle back ward and upward","Warming the solution to room temperature","Pacing the tip of the dropper on the edge of ear canal","Placing client in side lying position."],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"عند تقطير قطرة الأذن للبالغ: يُسحب صيوان الأذن للخلف والأعلى، وتُدفّأ القطرة لدرجة حرارة الغرفة، ويستلقي المريض على الجانب؛ ويُتجنّب ملامسة رأس القطّارة للأذن فيكون الخيار 3 (وضع رأس القطّارة على حافة القناة) هو المُتجنَّب.","src_disagrees":false,"refs":[{"t":"Delegation of Medication Administration: Ear Drops - NC Board of Nursing module","u":"https://www.ncbon.com/sites/default/files/documents/2024-03/module-eardrops_0.pdf"}],"hash":"cc35ab0a"},{"id":"Q0562","spec":"nursing","type":"mcq","lang":"en","q":"A nurse caring for a patient in the intensive care unit (ICU) implements strategies to create an environment conducive to sleep. Which strategy would be most effective?","qar":null,"options":["Turning off the lights in the room during the night","Having the television on at all times for background noise","Silencing the alarms on the bedside monitor and infusion pumps","Administering ordered analgesics around the clock, even if the patient denies pain."],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"لتحسين نوم مريض العناية المركزة يُخفَّض الضوء ليلًا ويُقلَّل الضجيج وتُجمَّع الرعاية؛ أما التلفاز المستمر وإسكات إنذارات الأجهزة (غير آمن) والمسكنات بلا ألم فغير مناسبة.","src_disagrees":false,"refs":[{"t":"Sleep in the Intensive Care Unit: Strategies for Improvement (eScholarship review)","u":"https://escholarship.org/content/qt43m279rj/qt43m279rj_noSplash_cadb017d80c1c20d12f102218f8e06d6.pdf?t=rvnts8"}],"hash":"ca673c18"},{"id":"Q0564","spec":"nursing","type":"mcq","lang":"en","q":"What is the definition of substance use disorder (SUD)?","qar":null,"options":["A compulsive need to experience pleasure","Behavior associated with maintaining an addiction","Absence of a substance will cause withdrawal symptoms","Overuse and dependence on a substance that negatively affects."],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"DSM-5 يعرّف اضطراب تعاطي المواد بأنه نمط إشكالي من التعاطي يؤدي إلى ضعف أو ضيق ذي دلالة سريرية؛ والخيار 4 الأقرب (إفراط وتبعية تؤثر سلبًا)، والخيارات الأخرى تصف أجزاء (رغبة/انسحاب) لا التعريف الكامل؛ نص الخيار الأخير مبتور قليلًا.","src_disagrees":false,"refs":[{"t":"Appendix A: DSM-IV-TR and DSM-5 Diagnostic Criteria - Public Safety Medicine","u":"https://www.publicsafetymedicine.org/leo/substance-use-disorders/appendix-a-dsm-iv-tr-and-dsm-5-diagnostic-criteria"}],"hash":"b05a9e2e"},{"id":"Q0569","spec":"nursing","type":"mcq","lang":"en","q":"Priority Decision: When should the nurse
