 من هذه الهرمونات يتحكم بشكل مباشر في وظيفة المبيض:","qar":null,"options":["هرمون الاستروجين والبروجسترون","الهرمون المنبه للجريب والبروجسترون","هرمون الاستروجين وهرمون اللوتين","الهرمون المنبه للجريب والهرمون اللوتيني"],"ans":3,"status":"verified","conf":"high","tier":"strong","why":["corrected"],"note":"الذي يتحكم مباشرة بوظيفة المبيض هو الهرمونان الموجِّهان للغدد التناسلية FSH وLH من النخامية؛ أما الإستروجين والبروجسترون فهما نواتج المبيض (تغذية راجعة) وليسا المتحكِّمَين به. (علامة المصدر على الخيار 0 خطأ).","src_disagrees":true,"refs":[{"t":"Physiology, Menstrual Cycle - StatPearls (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/books/NBK500020/"}],"hash":"a5441e8e"},{"id":"Q0481","spec":"midwifery","type":"mcq","lang":"ar","q":"يحدث غرس البويضة عادة بعد الإخصاب في:","qar":null,"options":["أسبوع واحد","يومان","أسبوعان","ثلاثة أسابيع"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الانغراس (implantation) يبدأ بعد الفقس بنحو 4–5 أيام من الإخصاب ويحدث عادةً بعد نحو أسبوع (6–10 أيام) من الإخصاب؛ المرجع المسترجَع ويكيبيديا فقط لذا الثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Implantation (embryology) - Wikipedia","u":"https://en.wikipedia.org/wiki/Implantation_(embryology)"}],"hash":"232393dc"},{"id":"Q0482","spec":"midwifery","type":"mcq","lang":"ar","q":"يسمى جزء البصيلة الذي يفرغ البويضة بـ:","qar":null,"options":["الجسم الابيض","الجسم الاصفر","الجريب الرئتي","حويصلات جراف"],"ans":1,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"الصياغة غامضة: الجريب الناضج (حويصلة جراف) هو الذي يُطلق البويضة، بينما ما يتبقى منه بعد الإباضة يتحول إلى الجسم الأصفر corpus luteum؛ الأرجح أن المقصود 'الجزء الذي أفرغ البويضة' = الجسم الأصفر (علامة المصدر)، لكن الخيار 3 (حويصلات جراف) معقول أيضاً والخيار 2 مشوَّه.","src_disagrees":false,"refs":[{"t":"Ovarian follicle - Wikipedia","u":"https://en.wikipedia.org/wiki/Ovarian_follicle"},{"t":"Corpus luteum - Wikipedia","u":"https://en.wikipedia.org/wiki/Corpus_luteum"}],"hash":"4da83578"},{"id":"Q0483","spec":"midwifery","type":"mcq","lang":"ar","q":"المخاض الذي يحدث تلقائيًا خلال أسبوعين من تاريخ الولادة المحسوب يسمى:","qar":null,"options":["المخاض الكاذب","المخاض الطبيعي","ما بعد الولادة الناضجة","الولادة المبكرة"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"المخاض التلقائي ضمن أسبوعين من موعد الولادة المتوقع (نحو 37–42 أسبوعاً، term) يُعدّ مخاضاً طبيعياً/عند تمام الحمل؛ المبكر \u003c37 أسبوعاً وما بعد الناضج >42 أسبوعاً؛ تعريفات ACOG من مرجع ثانوي (ويكيبيديا) لذا الثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Gestational age - Wikipedia","u":"https://en.wikipedia.org/wiki/Gestational_age"}],"hash":"2d6225cc"},{"id":"Q0489","spec":"midwifery","type":"mcq","lang":"ar","q":"التقيؤ الحملي قد يؤدي إلى:","qar":null,"options":["قلة البول","الجفاف","الكيتوزيه","كثرة السائل السلوي"],"ans":1,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"التقيؤ الحملي الشديد يؤدي إلى الجفاف واضطراب الشوارد والكيتونات (ketonuria) وقلة البول الناتجة عن الجفاف، فالخيارات 0 و1 و2 كلها نتائج معروفة؛ الجفاف هو الأكثر مباشرة وأشيعية (علامة المصدر) أما كثرة السائل السلوي فغير مرتبطة.","src_disagrees":false,"refs":[{"t":"Hyperemesis Gravidarum - StatPearls (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK532917/"}],"hash":"64ad8de0"},{"id":"Q0491","spec":"midwifery","type":"mcq","lang":"ar","q":"عند نضج البويضة يمكن من تقليل عدد الكروموسومات في نواتها إلى: -","qar":null,"options":["22","23 أزواج","44","47"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"البويضة (والنطفة) بعد الانقسام الاختزالي تحتوي 23 كروموسوماً (أحادية الصيغة haploid) مقابل 46 في الخلايا الجسدية؛ الخيار 1 هو الوحيد المتضمن الرقم 23، وكلمة 'أزواج' خطأ في الصياغة/الترجمة (المقصود 23 كروموسوماً لا 23 زوجاً).","src_disagrees":false,"refs":[{"t":"Meiosis - NHGRI Genetics Glossary","u":"https://www.genome.gov/genetics-glossary/Meiosis"}],"hash":"e6845949"},{"id":"Q0492","spec":"midwifery","type":"mcq","lang":"ar","q":"أي مما يلي لا يعتبر من مضاعفات الولادة :","qar":null,"options":["شلل الوجه","كسر الجمجمة من الضغط","ورم رأسي دموي","تخثر دم الأم"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"شلل الوجه وكسر الجمجمة والورم الدموي الرأسي cephalohematoma من إصابات الولادة birth injuries للوليد، أما تخثر دم الأم فليس من إصابات/مضاعفات الولادة بهذا المعنى؛ المرجع المسترجَع يسرد cephalohematoma والنزوف وشلل الضفيرة والكسور ولا يذكر شلل الوجه/كسر الجمجمة صراحة.","src_disagrees":false,"refs":[{"t":"Birth trauma (physical) - Wikipedia","u":"https://en.wikipedia.org/wiki/Birth_trauma_(physical)"}],"hash":"48530562"},{"id":"Q0495","spec":"midwifery","type":"mcq","lang":"ar","q":"الموعد التقديري للولادة لمن فاتها الدورة في ٢٠٢٠/٥/٥ هو: -","qar":null,"options":["٢٠٢٠/١٢/١٢","أكتوبر ٢٠٢٠/١٢/١٢","أغسطس ٢٠٢٠/١٢/١٢","٢٠٢٠/٢/١٢"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"بقاعدة نيغيلي (آخر دورة +7 أيام −3 أشهر +1 سنة): 5 مايو 2020 → 12 فبراير 2021؛ الخيار 3 هو الوحيد الموافق لليوم والشهر (12/2) لكن السنة المكتوبة 2020 خطأ مطبعي على الأرجح (الصحيح 2021)، والخيارات الأخرى تعطي 12 ديسمبر وهو خطأ.","src_disagrees":false,"refs":[{"t":"Gestational age - Wikipedia","u":"https://en.wikipedia.org/wiki/Gestational_age"}],"hash":"52902581"},{"id":"Q0496","spec":"midwifery","type":"mcq","lang":"ar","q":"الجزء الذي ينقل المغذيات والاكسجين للجنين في اليوم الثاني والثالث من الحمل :","qar":null,"options":["المشيمة","كيس الصفار","الجسم الأصفر","الحمل المشيمي"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"كيس الصفار yolk sac هو الذي يوفّر التغذية وتبادل الغازات للجنين المبكر قبل أن تتولى المشيمة ذلك؛ ملاحظة: اليوم الثاني/الثالث حرفياً يسبق تكوّن كيس الصفار (الأسبوع الثاني) فالأرجح أن المقصود الأسبوع الثاني والثالث.","src_disagrees":false,"refs":[{"t":"Yolk sac - Wikipedia","u":"https://en.wikipedia.org/wiki/Yolk_sac"}],"hash":"531a8f9b"},{"id":"Q0498","spec":"midwifery","type":"mcq","lang":"ar","q":"ورم بطانة الرحم يعني:-","qar":null,"options":["التهاب بطانة الرحم","التهاب عضل الرحم","التهاب المبايض","التهاب قناة فالوب"],"ans":0,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"الصياغة ملتبسة: 'ورم بطانة الرحم' على الأرجح ترجمة قديمة لـ endometritis (في العربية القديمة 'ورم' قد تعني التهاب) فتكون الإجابة التهاب بطانة الرحم (الخيار 0)؛ وإن كان المقصود endometrioma فهو كيس مبيضي لا التهاب. علامة المصدر (التهاب المبايض = oophoritis) لا تطابق أياً من المصطلحين.","src_disagrees":true,"refs":[{"t":"Endometritis - Wikipedia","u":"https://en.wikipedia.org/wiki/Endometritis"},{"t":"Endometrioma - Wikipedia","u":"https://en.wikipedia.org/wiki/Endometrioma"}],"hash":"4edbc78f"},{"id":"Q0502","spec":"midwifery","type":"mcq","lang":"ar","q":"الرعاية التمريضية لمنع نزيف الدم الناجم عن تمزق العجان هي:-","qar":null,"options":["رفع الساق","تطبيق وسادة ضغط نظيفة واخبار المرأة بالضغط على فخذيها.","إعطاء سينتوسينون","كل ما سبق"],"ans":1,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"لم أجد مرجعاً يحسم هذا البند التمريضي؛ الإجراء المعتاد لضبط نزف تمزق العجان هو الضغط المباشر بضمادة نظيفة ثم الخياطة، أما رفع الساق فليس إجراءً قياسياً والأوكسيتوسين لا يعالج نزف التمزق (الرحم متقلص)؛ الخيار 3 'كل ما سبق' وارد في بعض بنوك الأسئلة. علامة المصدر (رفع الساق) غير مدعومة.","src_disagrees":true,"refs":[{"t":"Postpartum Hemorrhage - StatPearls (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/books/NBK499988/"}],"hash":"528be230"},{"id":"Q0506","spec":"midwifery","type":"mcq","lang":"ar","q":"السبب الجوهري لقسم سيزيرن هو: -","qar":null,"options":["عدم التناسق في الرأس والحوض","من النوع الاختياري casein","مولود بحجم كبير","الأم المصابة بداء السكري"],"ans":0,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"عدم التناسب الرأسي الحوضي (CPD) هو المبرر التوليدي الكلاسيكي للقيصرية (وليس السكري أو كبر الجنين وحدهما، والقيصرية الاختيارية ليست «سببًا» طبيًا بحد ذاته)، لكن الصياغة «السبب الجوهري» غير محددة. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"1d322ea9"},{"id":"Q0507","spec":"midwifery","type":"mcq","lang":"ar","q":"أفضل وقت لإدخال اللولب هو: -","qar":null,"options":["بعد الحيض","بعد الولادة","قبل الحيض","في أي وقت"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"الإجابة التقليدية في كتب التمريض/القبالة: أثناء الحيض أو بُعيده لاستبعاد الحمل وليونة عنق الرحم، لكن CDC وAAFP تجيزان الإدخال في أي وقت من الدورة متى استُبعد الحمل بيقين معقول (والإدخال بعد الولادة مسموح) فخيار «في أي وقت» صحيح وفق هذه الإرشادات؛ اختلاف المرجعية يضعف الحسم.","src_disagrees":false,"refs":[{"t":"CDC US SPR: Intrauterine Contraception (At a glance)","u":"https://www.cdc.gov/contraception/hcp/usspr/intrauterine-contraception.html"},{"t":"Insertion and Removal of Intrauterine Devices - AAFP","u":"https://www.aafp.org/pubs/afp/issues/2005/0101/p95.html"}],"hash":"e1f5c7ee"},{"id":"Q0509","spec":"midwifery","type":"mcq","lang":"ar","q":"تتم زراعة البويضة الملقحة في: -","qar":null,"options":["الساقط القاعدي","الساقط المحافظي","بطانة الرحم","الأهداب"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"تنغرس الكيسة الأريمية في بطانة الرحم (الإندوميتريوم)، وبعد الانغراس تتحوّل البطانة إلى «ساقط»، ويُسمّى الجزء تحت موضع الانغراس الساقط القاعدي؛ فالخيار الأدق لموضع الانغراس هو بطانة الرحم، والأهداب لا علاقة لها. الثقة متوسطة لأن الساقط القاعدي هو نفسه بطانة موضع الانغراس بعد تحوّلها.","src_disagrees":false,"refs":[{"t":"BGDA Practical Placenta - Implantation and Early Placentation - UNSW Embryology","u":"https://embryology.med.unsw.edu.au/embryology/index.php/BGDA_Practical_Placenta_-_Implantation_and_Early_Placentation"},{"t":"Physiology of Reproduction - El-Mowafi (GFMER)","u":"https://www.gfmer.ch/Obstetrics_simplified/Physiology_of_reproduction.htm"}],"hash":"ba4612ac"},{"id":"Q0511","spec":"midwifery","type":"mcq","lang":"ar","q":"الرعاية التمريضية للمرأة الحامل عند ارتفاع ضغط الدم: -","qar":null,"options":["تشجيع المرأة علي الجلوس والنوم في وضعية الاستلقاء الجانبي.","زيادة النشاط وفقاً لتحملها","إعطاء حمية سوائل متساوية التوتر","إعطاء حمية غذائية غنية بالبروتين"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"من تدخلات التمريض لارتفاع ضغط الدم في الحمل/تسمم الحمل وضع المرأة في الاستلقاء الجانبي الأيسر مع الراحة ورفع الأطراف، والحمية متوازنة قليلة الصوديوم وليست زيادة النشاط؛ المرجع تمريضي (Nurse.com) فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Preeclampsia: Nursing Diagnosis & Interventions - Nurse.com","u":"https://www.nurse.com/clinical-guides/preeclampsia/"}],"hash":"39b516e4"},{"id":"Q0513","spec":"midwifery","type":"mcq","lang":"ar","q":"أفضل وقت لإعطاء الميثيرجين methergin هو: -","qar":null,"options":["أثناء ولادة الطفل","أثناء مخاض المشيمة","بعد ولادة المشيمة","بعد ولادة الطفل"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"نشرة ميثيرجين (ميثيل إرجونوفين) تذكر الإعطاء بعد خروج الكتف الأمامي أو بعد خروج المشيمة أو في النفاس، والإجابة المعتمدة في كتب القبالة «بعد ولادة المشيمة»؛ والخيار «بعد ولادة الطفل» قريب لذا الثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Methergine prescribing information - Drugs.com","u":"https://www.drugs.com/pro/methergine.html"}],"hash":"f9c91cd8"},{"id":"Q0520","spec":"midwifery","type":"mcq","lang":"ar","q":"كلها موانع الحث على الولادة باستثناء:","qar":null,"options":["وضعية غير طبيعية للجنين","طول فترة الولادة","مساعدة متوسع كاملة","انقباض الرحم التدريجي المنتظم"],"ans":1,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"موانع الحث: الوضعية غير الطبيعية للجنين مانع مؤكد، أما «طول فترة (الحمل/الولادة)» فمن دواعي الحث (الحمل المتأخر) أو التعزيز لا من موانعه، لكن الخيارين الثالث والرابع مترجمان بشكل مشوّش (مساعدة متوسع كاملة/انقباض تدريجي منتظم) فيتعذّر الجزم. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"c541e539"},{"id":"Q0521","spec":"midwifery","type":"mcq","lang":"ar","q":"واحدة مما يلي من علامة الحمل المحتملة: -","qar":null,"options":["تقلصات Braxton hick's","تطبيق حركة الجنين بواسطة مقدم الرعاية الصحية","الم الثدي","صوت قلب الجنين"],"ans":0,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"تصنيف علامات الحمل: تقلصات براكستون هيكس علامة «محتملة»، وألم الثدي علامة «مرجّحة/افتراضية»، أما حركة الجنين المحسوسة بالفحص وصوت القلب فعلامات «مؤكدة»؛ فالخيار الأول هو الصحيح وفق التصنيف المعتاد. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"509ddece"},{"id":"Q0522","spec":"midwifery","type":"mcq","lang":"ar","q":"كلها من خصائص السائل الأمنيوسي باستثناء: -","qar":null,"options":["يتكون من ٩٨٪ من الماء","يتكون ١-٢٪ من مواد عضوية وصلبة غير عضوية","الكمية أقل من ٥٠٠ مل","يمنع التصاق السلى."],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"سائل السلى يتكوّن من نحو 98-99% ماء و1-2% مواد صلبة ويحمي الجنين ويمنع الالتصاق، وحجمه عند الولادة 500-1000 مل (نحو 800 مل في الأسبوع 28 ويهبط بعد الاستحقاق) فعبارة «أقل من 500 مل» هي الاستثناء؛ المرجع (ويكيبيديا) لا ينص على نسبة الماء فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Amniotic fluid - Wikipedia","u":"https://en.wikipedia.org/wiki/Amniotic_fluid"}],"hash":"faf9aebf"},{"id":"Q0526","spec":"midwifery","type":"mcq","lang":"ar","q":"الطبقة الوظيفية للرحم هي: -","qar":null,"options":["بطانة الرحم","عضلة الرحم","الظهارة الرحمية","الغشاء الساقط (غشاء الرحم الداخلي)"],"ans":0,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"الطبقة الوظيفية stratum functionalis هي الطبقة السطحية من بطانة الرحم (endometrium) التي تتجدد وتنسلخ مع الحيض، لكن «الغشاء الساقط» هو البطانة نفسها بعد تحوّلها في الحمل فالخيار الرابع قابل للتأويل، والخيار «الظهارة الرحمية» غامض؛ لذا الثقة ضعيفة.","src_disagrees":false,"refs":[{"t":"Uterine Cycle - Anatomy and Physiology (UEN Pressbooks)","u":"https://uen.pressbooks.pub/anatomyphysiology2/chapter/uterine-cycle/"},{"t":"BGDA Practical Placenta - Implantation and Early Placentation - UNSW Embryology","u":"https://embryology.med.unsw.edu.au/embryology/index.php/BGDA_Practical_Placenta_-_Implantation_and_Early_Placentation"}],"hash":"655d764b"},{"id":"Q0528","spec":"midwifery","type":"mcq","lang":"ar","q":"من علامات نزول المشيمة عدا: -","qar":null,"options":["ألم، إفرازات مهبلية بنية داكنة","رحم رقيق غير رقيق ذو نغمة طبيعية","رحم كروي مع قاع مرتفع","كل ما سبق"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"علامات نزول/انفصال المشيمة: اندفاع دم، واستطالة الحبل، ورحم كروي صلب وقاع مرتفع؛ أما «الألم والإفرازات البنية الداكنة» فليست من العلامات المعتمدة، لكن الخيار الثاني مترجم بشكل غير مفهوم والخيار «كل ما سبق» يناقض صيغة الاستثناء فالسؤال ركيك.","src_disagrees":false,"refs":[{"t":"Normal Labor: Physiology, Evaluation, and Management - StatPearls (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/books/NBK544290/"}],"hash":"71647e29"},{"id":"Q0529","spec":"midwifery","type":"mcq","lang":"ar","q":"أي من التأثيرات الجانبية التالية على الممرض ان يتوقعها عند المرضى الذين يتناولون علاج atropine sulfate","qar":null,"options":["جفاف في الفم","زيادة إفراز اللعاب","ارتفاع معدل النبض","انخفاض درجة الحرارة"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"جفاف الفم (xerostomia) من أشيع الآثار الجانبية لأتروبين وهو الإجابة المعتمدة، لكن تسرّع القلب (الخيار الثالث) أثر جانبي صحيح أيضًا وتصفه StatPearls بأنه الأكثر ملاحظة سريريًا، فيوجد أكثر من خيار صحيح.","src_disagrees":false,"refs":[{"t":"Atropine - StatPearls (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/books/NBK470551/"}],"hash":"cf2ef9b2"},{"id":"Q0531","spec":"midwifery","type":"mcq","lang":"ar","q":"هناك تغيرات كثيرة تطرأ على الأم أثناء فترة الحمل من التغيرات التي تحدث على القلب-:","qar":null,"options":["لا يحدث أي تغيير","ينقص معدل النبض","يزداد معدل النبض","يقل حجم القلب"],"ans":2,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"يزداد معدل نبض الأم في الحمل (بنحو 10-20 نبضة/دقيقة) مع زيادة النتاج القلبي وحجم الدم، ويكبر القلب قليلًا لا يصغر. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"86d1011d"},{"id":"Q0533","spec":"midwifery","type":"mcq","lang":"ar","q":"تسمع دقات قلب الجنين بوضوح عند عمر-:","qar":null,"options":["٨ اسابيع","١٢ اسبوع","١٦ اسبوع","٢٠ اسبوع"],"ans":1,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"يُسمع قلب الجنين بالدوبلر نحو الأسبوع 10-12 وبسماعة التوليد (fetoscope) نحو 18-20 أسبوعًا، فكلمة «بوضوح» غامضة بين 12 و20؛ والمصدر يعلّم 12 أسبوعًا. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"fe8e6af7"},{"id":"Q0535","spec":"midwifery","type":"mcq","lang":"ar","q":"أي من الفئات التالية يجب عدم إعطائها Barbiturates:","qar":null,"options":["الأطفال اقل من ٥ سنوات","المرأة الحامل","المرأة المرضع","البالغين الذين يعانون من القرحة النازفة"],"ans":1,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"الباربيتورات تُتجنَّب في الحمل لخطر تشوهات وتأثيرات على الوليد (وتُستعمل بحذر في الإرضاع)، والمصدر يعلّم الحامل؛ لكن خيار المرضع قد يُعدّ صحيحًا أيضًا فلا يوجد جزم. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"c1cce0b9"},{"id":"Q0536","spec":"midwifery","type":"mcq","lang":"ar","q":"أي من الفئات التالية يجب عدم إعطائها دواء (ergotamine tartrate)","qar":null,"options":["مرضى السكري","مرضى الربو","النساء الحوامل","مرضى مدمنى الكحول ."],"ans":2,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"إرغوتامين من مقبضات الأوعية ومقلّصات الرحم ويُمنع في الحمل (فئة X)، وهو معلوم لكن لم يُفتح مرجع لذلك. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"02fee8a9"},{"id":"Q0537","spec":"midwifery","type":"mcq","lang":"ar","q":"تحقن التحصينات بواسطة الحقن :","qar":null,"options":["تحت الجلد","بالجلد .","بالعضل.","بالوريد"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"حسب CDC تُعطى اللقاحات القابلة للحقن بالطريق العضلي أو تحت الجلد (MMR والجدري المائي تحت الجلد؛ DTaP والكبد B والإنفلونزا عضليًا) وBCG داخل الجلد، فلا يوجد طريق واحد لكل التحصينات؛ الإبقاء على علامة المصدر (تحت الجلد) ترجيح ضعيف.","src_disagrees":false,"refs":[{"t":"Vaccine Administration - CDC ACIP General Best Practice Guidelines","u":"https://www.cdc.gov/vaccines/hcp/acip-recs/general-recs/administration.html"}],"hash":"865f84df"},{"id":"Q0540","spec":"midwifery","type":"mcq","lang":"ar","q":"لمنع حدوث التهاب الوريد الخثاري ، ينبغي إرشاد الأم في مرحلة مابعد الولادة باتباع أي من الإجراءات التالية :-","qar":null,"options":["ارتداء الجوارب المطاطية.","التحرك المبكر .","العلاج بمضادات التجلط.","أداء التمرينات."],"ans":1,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"المطلوب «إرشاد الأم» للوقاية، والتمريض يوصي بالحركة المبكرة (مع الإماهة) وقد تُضاف الجوارب المرنة؛ أما مضادات التجلط فتُوصف طبيًا للحالات عالية الخطورة لا كإرشاد عام، ولذا لا أوافق علامة المصدر لكن دون مرجع مفتوح. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":true,"refs":[],"hash":"3b18a90e"},{"id":"Q0541","spec":"midwifery","type":"mcq","lang":"ar","q":"كلما ينمو الطفل في السن التغيرات التي تطرأ على سرعة التنفس وضربات القلب :-","qar":null,"options":["بالزيادة في المعدل.","بالنقص في المعدل","بالثبات على المعدل.","بالاستقرار على معدل الشخص البالغ."],"ans":1,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"معدلا النبض والتنفس أعلى عند الرضّع والأطفال الصغار ثم ينخفضان تدريجيًا مع النمو حتى يصلا إلى معدل البالغ في المراهقة. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"98c45e78"},{"id":"Q0542","spec":"midwifery","type":"mcq","lang":"ar","q":"السبب الأساسي لتوقف قلب الأطفال هو :-","qar":null,"options":["توقف التنفس.","امراض الأوعية القلبية","الصعق الكهربائي.","الغرق.","التسمم"],"ans":0,"status":"verified","conf":"high","tier":"strong","why":["corrected"],"note":"توقف القلب عند الأطفال لا ينتج عادة عن سبب قلبي أولي بل عن فشل تنفسي متقدّم أو صدمة (اختناقي)، فتُصحَّح الإجابة إلى «توقف التنفس» وفق إرشادات AHA 2020؛ والغرق والصعق والتسمم أسباب فرعية.","src_disagrees":true,"refs":[{"t":"Part 4: Pediatric Basic and Advanced Life Support: 2020 AHA Guidelines for CPR and ECC","u":"https://www.ahajournals.org/doi/10.1161/CIR.0000000000000901"}],"hash":"d214a79c"},{"id":"Q0544","spec":"midwifery","type":"mcq","lang":"ar","q":"يبدأ المولود بالتنفس تلقائياً بعد تنظيف المجاري التنفسية خلال ......","qar":null,"options":["دقيقة واحدة.","٣٠ ثانية .","٣ دقائق .","٩٠ ثانية ."],"ans":1,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"معظم حديثي الولادة يبدؤون التنفس خلال نحو 30 ثانية بعد التجفيف/تنظيف المجرى، وتبدأ التهوية إن لم يتنفس خلال الدقيقة الأولى؛ لذا قد يكون المفتاح 30 ثانية أو دقيقة واحدة بحسب المرجع. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"428a0b88"},{"id":"Q0548","spec":"midwifery","type":"mcq","lang":"ar","q":"أثناء الولادة وبعد خروج رأس الجنين ، وجدت الحبل السري ملتف حول رقبة الجنين فماذا تفعل :-","qar":null,"options":["الانتظار حتى توقف النبضات القوية بالحبل السري ثم نضع مشبكين ونقص الحبل السري.","محاولة إزالة الحبل السري من حول الرقبة وذلك بوضع أصبعين تحت الحبل السري خلف رقبة الجنين ومحاولة إزاحة الحبل السري إلى الأمام، وفي حال الفشل يجب وضع مشبكين فورا وقص الحبل السري.","يجب استخدام مشابك معقمة لربط الحبل السري.","أ ، ب .","ب ، ج معاً ."],"ans":4,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"في التفاف الحبل حول العنق: يُحاول تمرير الحبل فوق الرأس بإصبعين، وإن تعذّر يُوضع مشبكان فورًا ويُقص (العبارة ب)، ويجب استخدام مشابك معقمة (ج)؛ أما الانتظار حتى توقف النبض (أ) فغير مناسب مع الحبل الملتف الضيق، فالإجابة «ب، ج». (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"8030967f"},{"id":"Q0550","spec":"midwifery","type":"mcq","lang":"ar","q":"أثناء الولادة وبمجرد خروج رأس الجنين يجب على المسعف اجراء شفط الافرازات :-","qar":null,"options":["من الفم أولاً .","من الأنف أولاً.","من الفم والأنف باستخدام جهاز الشفط الكهربائي.","باستخدام بصيلة الشفط .","أ ، د معاً ."],"ans":4,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"المعتاد في نصوص الإسعاف القديمة شفط الفم أولًا ثم الأنف بالبصيلة؛ فالإجابة «أ، د»، لكن الإرشادات الحديثة للإنعاش (NRP/AHA) لا توصي بالشفط الروتيني لحديثي الولادة الأصحاء. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"21dd0555"},{"id":"Q0552","spec":"midwifery","type":"mcq","lang":"ar","q":"أفضل ما يمكن عمله للاستشارة الوراثية هو في: -","qar":null,"options":["الثلث الأول","الثلث الثاني","الثلث الثالث","في أي وقت"],"ans":0,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"الأفضل تقديم الاستشارة الوراثية قبل الحمل أو في أبكر وقت من الحمل (الثلث الأول) وفق الممارسة المعتادة، وعلامة المصدر (الثلث الثاني) غير مدعومة؛ لكن بعض المقررات تقول «في أي وقت» فالثقة ضعيفة. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":true,"refs":[],"hash":"175931a3"},{"id":"Q0553","spec":"midwifery","type":"mcq","lang":"ar","q":"يبلغ محيط رأس الطفل عند الولادة:-","qar":null,"options":["٣٠ سم","٣٥سم","٤٠سم","٥٠ سم"],"ans":1,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"متوسط محيط رأس المولود تام الحمل نحو 34-35 سم (المدى الطبيعي 32-37)، فأقرب الخيارات 35 سم. (لم يتيسّر فتح مرجع موثوق لهذا السؤال بسبب تقييد أداة الجلب؛ الإجابة من المعرفة الطبية المستقرة وتحتاج مراجعة مرجعية قبل الاعتماد.)","src_disagrees":false,"refs":[],"hash":"ff11f51a"},{"id":"Q0554","spec":"midwifery","type":"mcq","lang":"ar","q":"من أكثر الأمراض المؤدية إلى ولادات أطفال ذو أوزان قليلة:-","qar":null,"options":["سوء التغذية","مرض مقدمة الارتجاج","عدم ممارسة الأم للرياضة","لا شيء مما ذكر"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"سوء تغذية الأم سبب رئيسي لانخفاض وزن المواليد خاصة في الدول النامية (وفقر الدم مرتبط بانخفاض الوزن وفق منظمة الصحة العالمية)، لكن مقدمة الارتجاج (تسمم الحمل) سبب معروف أيضًا فالمفاضلة تتوقف على مفهوم «الأكثر».","src_disagrees":false,"refs":[{"t":"Anaemia - WHO fact sheet","u":"https://www.who.int/news-room/fact-sheets/detail/anaemia"}],"hash":"c40a4781"},{"id":"Q0556","spec":"midwifery","type":"mcq","lang":"ar","q":"من خصائص الوليد التشريحية:-","qar":null,"options":["يكون رأسه كبيرا بالنسبة لجسمه","يكون البطن صغيرا ومندثر","يكون صدره كبيرا بالنسبة لباقي جسمه","وزن الوليد الأنثى اكبر قليلا من وزن الوليد الذكر"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["corrected","general"],"note":"الصحيح أن رأس الوليد كبير نسبةً إلى جسمه (≈ربع طول الجسم)؛ أما البطن فيكون مستديراً بارزاً لا صغيراً ومندثراً، ومحيط الصدر أصغر من محيط الرأس بنحو ٢ سم، ووزن الذكر أعلى قليلاً من الأنثى (٣٫٣٤ مقابل ٣٫٢٦ كغ) فخيار «الأنثى أكبر» خاطئ وعلامة المصدر غير صحيحة.","src_disagrees":true,"refs":[{"t":"OpenStax Maternal-Newborn Nursing - Physical Assessment of the Newborn","u":"https://med.libretexts.org/Bookshelves/Nursing/Maternal-Newborn_Nursing_(OpenStax)/23:_Newborn_Assessment/23.02:_Physical_Assessment_of_the_Newborn"},{"t":"Wikipedia - Infant (newborn proportions)","u":"https://en.wikipedia.org/wiki/Infant"},{"t":"ScienceInsights - How Big Are Newborns (boys vs girls birth weight)","u":"https://scienceinsights.org/how-big-are-newborns-weight-length-normal-ranges/"}],"hash":"a15db681"},{"id":"Q0557","spec":"midwifery","type":"mcq","lang":"ar","q":"الحمل العنقودي هو نوع من الأورام الحميدة التي تصيب:-","qar":null,"options":["الجنين نفسه","المشيمة","جدار الرحم","قناة فالوب"],"ans":1,"status":"verified","conf":"high","tier":"strong","why":["corrected"],"note":"الحمل العنقودي (الرحى العدَرية) ينشأ من تكاثر شاذ لنسيج المشيمة (الأرومة الغاذية) ويُعدّ ورماً حميداً (سابقاً للخباثة)، وليس ورماً في جدار الرحم؛ غزو العضلة الرحمية يحدث فقط في الرحى الغازية/المرض الأرومي الغاذي المستمر.","src_disagrees":true,"refs":[{"t":"StatPearls - Hydatidiform Mole (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK459155/"}],"hash":"5bffce58"},{"id":"Q0558","spec":"midwifery","type":"mcq","lang":"ar","q":"الحمل الهاجر هو غرس البويضة الملقحة خارج التجويف الرحمي من أسبابه","qar":null,"options":["الاجهاض المتكرر","التهاب قناة فالوب","تضيق قناة فالوب","جميع ما ذكر"],"ans":2,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"التهاب قناة فالوب (PID) وتلف/تضيّق القناة عاملان مثبتان للحمل الهاجر بينما الإجهاض السابق لا يُعدّ عامل خطر في StatPearls وMedscape؛ فخيار «جميع ما ذكر» غير مدعوم، لكن الخيارين ب وج كلاهما صحيح فالسؤال معيب، وأُبقيت علامة المصدر (ج) بثقة منخفضة.","src_disagrees":false,"refs":[{"t":"StatPearls - Ectopic Pregnancy (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK539860/"},{"t":"Medscape - Ectopic Pregnancy: Etio ival retract","All of above"],"ans":2,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"دقة الطبعة للحواف تحت اللثة تتطلب إزاحة لثوية مناسبة لتتمكن المادة خفيفة القوام من تسجيل حد التحضير (Wikipedia)؛ أما «مادة كارهة للماء» فليست تحسّناً (السيليكون الكاره يحتاج تحكماً ممتازاً بالرطوبة) وصياغة «low viscosity» مبتورة، فأُرجّح ج بثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Wikipedia - Dental impression","u":"https://en.wikipedia.org/wiki/Dental_impression"}],"hash":"60c7184c"},{"id":"Q0419","spec":"dental","type":"mcq","lang":"en","q":"extension of oblique ridge ?","qar":null,"options":["mesiobuccal to distolingual","Distobuccal to distolingual","Mesiolingual to distobuccal","Distobuccal to distolingual"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الحرف المائل (Oblique ridge) في الأضراس العلوية يتكوّن من اتحاد حرف الحدبة الأنسية اللسانية (المتجه للوحشي) والحرف المثلثي للحدبة الوحشية الشدقية، أي من الأنسي-اللساني إلى الوحشي-الشدقي؛ الخياران ب ود متطابقان.","src_disagrees":false,"refs":[{"t":"Wikipedia - Dental anatomy (oblique ridge)","u":"https://en.wikipedia.org/wiki/Dental_anatomy"}],"hash":"0fb7ae5b"},{"id":"Q0420","spec":"dental","type":"mcq","lang":"en","q":"cavity varnish ( copalite) all true except ?","qar":null,"options":["Use prior cementation restoration","Sealing dental tubules","Used under resin and glass ionomer","Rabidly vaporized"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"ورنيش الكافيتي (Copal varnish) يسدّ الأنبوبات العاجية ويتبخر مذيبه بسرعة ويُستعمل قبل التلصيق بالزنك فوسفات أو تحت الأملغم، ولا يُستعمل تحت الراتنج المركب أو الزجاجي الأيونومر (يتعارض مع الالتصاق/التصلب)، فالاستثناء هو الخيار ج؛ المراجع تدعم الخيارات الثلاثة الصحيحة.","src_disagrees":false,"refs":[{"t":"Wikipedia - Dental amalgam (cavity varnish)","u":"https://en.wikipedia.org/wiki/Dental_amalgam"},{"t":"Wikipedia - Dental cement","u":"https://en.wikipedia.org/wiki <div class="app" id="app" dir="rtl" lang="ar"></div>
<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('bank-data').textContent);
const ITEMS = DATA.items;
const BY_ID = new Map(ITEMS.map((q) => [q.id, q]));
const SPEC = { assistant: 'مساعد طبيب', nursing: 'تمريض', midwifery: 'قبالة', dental: 'أسنان' };
const WHY = { tentative: 'إجابة غير مؤكدة', corrected: 'صُحّحت مقابل المصدر', general: 'مراجعها عامة فقط', override: 'عُدّلت يدويًا' };
const WHY_CLASS = { tentative: 't', corrected: 'c', general: 'g', override: 'c' };
const CONF = { high: 'ثقة عالية', medium: 'ثقة متوسطة', low: 'ثقة منخفضة' };
const STORE_KEY = 'physician-review:' + DATA.version;
const VERBS = { ok: 'وافق', fix: 'صحّح', bad: 'معيب', note: 'ملاحظة' };

/* ---------- storage (every access guarded; falls back to memory) ---------- */
let memory = null;
let persistent = true;
function loadState() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return sanitize(JSON.parse(raw)); } catch { persistent = false; }
  return sanitize(memory);
}
function saveState() {
  memory = JSON.parse(JSON.stringify({ reviewer: S.reviewer, dec: S.dec }));
  try { localStorage.setItem(STORE_KEY, JSON.stringify(memory)); } catch { persistent = false; }
}
function sanitize(x) {
  const out = { reviewer: '', dec: {} };
  if (!x || typeof x !== 'object') return out;
  if (typeof x.reviewer === 'string') out.reviewer = x.reviewer.slice(0, 80);
  if (x.dec && typeof x.dec === 'object') {
    for (const [id, d] of Object.entries(x.dec)) {
      const q = BY_ID.get(id);
      if (!q || !d || typeof d !== 'object') continue;
      const c = typeof d.c === 'string' ? d.c.slice(0, 600) : '';
      const kind = ['ok', 'fix', 'bad', 'note'].includes(d.d) ? d.d : null;
      if (!kind) continue;
      if (kind === 'ok' && q.ans == null) continue;
      if (kind === 'fix' && !(Number.isInteger(d.a) && d.a >= 0 && d.a < q.options.length && d.a !== q.ans)) continue;
      out.dec[id] = kind === 'fix' ? { d: kind, a: d.a, c } : { d: kind, c };
    }
  }
  return out;
}

/* ---------- tiny DOM helpers (text nodes only; no HTML parsing) ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const SVG_NS = 'http://www.w3.org/2000/svg';
function icon(d) {
  const s = document.createElementNS(SVG_NS, 'svg');
  s.setAttribute('class', 'i'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
  for (const part of d) { const p = document.createElementNS(SVG_NS, 'path'); p.setAttribute('d', part); s.append(p); }
  return s;
}
const ICON = {
  check: ['M5 12.5l4.2 4.2L19 7'],
  flag: ['M6 21V4', 'M6 5h11l-2 4 2 4H6'],
  next: ['M15 5l-7 7 7 7'],
  prev: ['M9 5l7 7-7 7'],
  map: ['M4 4h6v6H4z', 'M14 4h6v6h-6z', 'M4 14h6v6H4z', 'M14 14h6v6h-6z'],
};
function safeUrl(u) { try { const x = new URL(u); return x.protocol === 'https:' ? x.href : null; } catch { return null; } }
function optLabel(q, k) {
  if (q.type === 'tf') return k === 0 ? 'ص' : 'خ';
  const ar = ['أ', 'ب', 'ج', 'د', 'هـ', 'و'], en = ['A', 'B', 'C', 'D', 'E', 'F'];
  return (q.lang === 'ar' ? ar : en)[k] || String(k + 1);
}

/* ---------- state ---------- */
const S = Object.assign(loadState(), { view: 'review', spec: 'all', why: 'all', st: 'all', pos: 0, mapOpen: false, err: '', flash: '', msg: '' });
let advanceTimer = null;

function decided(id) { const d = S.dec[id]; return d && d.d !== 'note'; }
function visible() {
  return ITEMS.filter((q) =>
    (S.spec === 'all' || q.spec === S.spec) &&
    (S.why === 'all' || q.why.includes(S.why)) &&
    (S.st === 'all' || (S.st === 'pending' ? !decided(q.id) : decided(q.id))));
}
function counts() {
  const c = { ok: 0, fix: 0, bad: 0, note: 0 };
  for (const q of ITEMS) { const d = S.dec[q.id]; if (d) c[d.d]++; }
  return c;
}
function setDec(q, d, extra) {
  const prevC = (S.dec[q.id] && S.dec[q.id].c) || '';
  S.dec[q.id] = Object.assign({ d, c: prevC }, extra || {});
  saveState();
}
function clearDec(q) { const c = (S.dec[q.id] && S.dec[q.id].c) || ''; if (c) S.dec[q.id] = { d: 'note', c }; else delete S.dec[q.id]; saveState(); }

function go(delta) {
  const list = visible(); if (!list.length) return;
  S.pos = Math.min(Math.max(S.pos + delta, 0), list.length - 1); S.flash = ''; render(true);
}
function goNextPending() {
  const list = visible();
  for (let k = 1; k <= list.length; k++) {
    const i = (S.pos + k) % list.length;
    if (!decided(list[i].id)) { S.pos = i; S.flash = ''; render(true); return; }
  }
  S.flash = 'لا توجد أسئلة بلا قرار في هذه القائمة.'; render(false);
}
function afterDecision() {
  clearTimeout(advanceTimer);
  render(false);
  advanceTimer = setTimeout(() => { goNextPending(); }, 450);
}

/* ---------- views ---------- */
const app = document.getElementById('app');

function header() {
  const c = counts(); const done = c.ok + c.fix + c.bad; const total = ITEMS.length;
  const pct = (n) => (n / total * 100).toFixed(2) + '%';
  return h('header', { class: 'top' },
    h('div', { class: 'row spread' },
      h('h1', null, 'مراجعة الأسئلة الطبية'),
      h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'العرض' },
        h('button', { type: 'button', role: 'tab', 'aria-selected': S.view === 'review' ? 'true' : 'false', onclick: () => { S.view = 'review'; S.msg = ''; render(true); } }, 'مراجعة'),
        h('button', { type: 'button', role: 'tab', 'aria-selected': S.view === 'export' ? 'true' : 'false', onclick: () => { S.view = 'export'; S.msg = ''; render(true); } }, 'التسليم'))),
    h('div', { class: 'meter', role: 'img', 'aria-label': `تمت مراجعة ${done} من ${total}` },
      h('i', { class: 'm-ok', style: `width:${pct(c.ok)}` }), h('i', { class: 'm-fix', style: `width:${pct(c.fix)}` }), h('i', { class: 'm-bad', style: `width:${pct(c.bad)}` })),
    h('div', { class: 'prog' }, `${done} من ${total} بقرار · وافقتَ على ${c.ok} · صحّحتَ ${c.fix} · عيّبتَ ${c.bad}`));
}

function pills(label, key, options) {
  return h('div', { class: 'group', role: 'group', 'aria-label': label },
    options.map(([val, text]) => h('button', { type: 'button', class: 'pill', 'aria-pressed': S[key] === val ? 'true' : 'false', onclick: () => { S[key] = val; S.pos = 0; render(true); } }, text)));
}

function mapPanel(list) {
  return h('section', { class: 'card', 'aria-label': 'خريطة الأسئلة' },
    h('div', { class: 'filters' },
      pills('القسم', 'spec', [['all', 'كل الأقسام'], ...Object.entries(SPEC)]),
      pills('سبب الإحالة', 'why', [['all', 'كل الأسباب'], ...Object.entries(WHY)]),
      pills('الحالة', 'st', [['all', 'الكل'], ['pending', 'بلا قرار'], ['done', 'بقرار']])),
    h('div', { class: 'map' }, list.map((q, i) => {
      const d = S.dec[q.id]; const cls = d ? d.d : '';
      return h('button', { type: 'button', class: `cell ${cls} ${i === S.pos ? 'cur' : ''}`, 'aria-label': `السؤال ${i + 1}${d ? ' — ' + VERBS[d.d] : ''}`, onclick: () => { S.pos = i; S.mapOpen = false; S.flash = ''; render(true); } }, i + 1);
    })));
}

function optionsEl(q, d) {
  const propIdx = q.ans;
  return h('div', { class: 'opts', role: 'group', 'aria-label': 'الخيارات' }, q.options.map((o, k) => {
    const isProp = k === propIdx;
    const fixSel = d && d.d === 'fix' && d.a === k;
    const okSel = d && d.d === 'ok' && isProp;
    const struck = d && d.d === 'fix' && isProp;
    const cls = ['opt', isProp && !struck ? 'prop' : '', okSel ? 'ok-sel' : '', fixSel ? 'fix-sel' : '', struck ? 'struck' : ''].join(' ');
    const tag = fixSel ? 'إجابة الطبيب' : okSel ? 'وافقتَ عليها' : isProp ? (q.status === 'tentative' ? 'المقترحة (غير مؤكدة)' : 'المقترحة') : '';
    return h('button', { type: 'button', class: cls, 'aria-pressed': (fixSel || okSel) ? 'true' : 'false',
      onclick: () => { if (k === propIdx) setDec(q, 'ok'); else setDec(q, 'fix', { a: k }); afterDecision(); } },
      h('span', { class: 'k', 'aria-hidden': 'true' }, optLabel(q, k)),
      h('span', { dir: 'auto' }, o),
      h('span', { class: 'tag' }, tag));
  }));
}

function stateLine(q, d) {
  if (!d) return null;
  if (d.d === 'ok') return h('div', { class: 'state ok', role: 'status' }, 'قرارك: موافق على الإجابة المقترحة.');
  if (d.d === 'fix') return h('div', { class: 'state fix', role: 'status' }, `قرارك: الإجابة الصحيحة هي (${optLabel(q, d.a)}) ${q.options[d.a]}`);
  if (d.d === 'bad') return h('div', { class: 'state bad', role: 'status' }, 'قرارك: السؤال معيب ولا يصلح للنشر.');
  return h('div', { class: 'state note', role: 'status' }, 'ملاحظة فقط، بلا قرار.');
}

function reviewView() {
  const list = visible();
  const main = h('main');
  main.append(h('div', { class: 'row spread' },
    h('button', { type: 'button', class: 'btn sm', 'aria-expanded': S.mapOpen ? 'true' : 'false', onclick: () => { S.mapOpen = !S.mapOpen; render(false); } }, icon(ICON.map), `الخريطة والفلاتر (${list.length})`),
    h('span', { class: 'prog' }, list.length ? `${S.pos + 1} / ${list.length}` : '')));
  if (S.mapOpen) main.append(mapPanel(list));
  if (S.flash) main.append(h('div', { class: 'notice', role: 'status' }, S.flash));
  if (!persistent) main.append(h('div', { class: 'notice warn' }, 'المتصفح لا يسمح بالحفظ التلقائي: لن يبقى تقدّمك بعد إغلاق الصفحة. اذهب إلى «التسليم» وصدّر قراراتك قبل الإغلاق.'));
  if (!list.length) { main.append(h('div', { class: 'card' }, h('p', null, 'لا توجد أسئلة تطابق هذه الفلاتر.'))); return [main, null]; }
  if (S.pos >= list.length) S.pos = list.length - 1;
  const q = list[S.pos]; const d = S.dec[q.id];

  const refs = q.refs.map((r) => { const u = safeUrl(r.u); return u ? h('li', null, h('a', { href: u, target: '_blank', rel: 'noopener noreferrer' }, r.t || u)) : null; });
  main.append(h('article', { class: 'card', 'aria-label': 'السؤال' },
    h('div', { class: 'row spread' },
      h('div', { class: 'chips' }, h('span', { class: 'chip' }, SPEC[q.spec]), q.why.map((w) => h('span', { class: `chip ${WHY_CLASS[w]}` }, WHY[w])), h('span', { class: 'chip' }, CONF[q.conf])),
      h('span', { class: 'id' }, q.id)),
    h('p', { class: 'stem', dir: 'auto', tabindex: '-1', id: 'stem' }, q.q),
    q.qar && q.qar !== q.q ? h('p', { class: 'stem-ar', dir: 'auto' }, q.qar) : null,
    optionsEl(q, d),
    h('p', { class: 'hint' }, q.ans == null ? 'لا توجد إجابة مقترحة. اضغط على الخيار الصحيح.' : 'اضغط على الخيار الصحيح: المقترحة تعني موافقة، وأي خيار آخر يعني تصحيحًا.'),
    stateLine(q, d),
    h('p', { class: 'why', dir: 'auto' }, h('b', null, 'مسوّغ الإجابة المقترحة (نتاج بحث آلي)'), q.note || '—'),
    q.src_disagrees ? h('p', { class: 'hint' }, 'المصدر الأصلي علّم إجابة مختلفة عن المقترحة.') : null,
    h('div', null, h('span', { class: 'tier' }, q.tier === 'strong' ? 'المراجع: جهات موثوقة' : q.tier === 'general' ? 'المراجع: عامة فقط (ويكيبيديا / مواقع تعليمية)' : 'بلا مراجع'),
      refs.filter(Boolean).length ? h('ul', { class: 'refs' }, refs) : null),
    h('details', { open: !!(d && d.c) ? 'true' : null }, h('summary', null, 'ملاحظتي على السؤال (اختياري)'),
      h('textarea', { id: 'note-' + q.id, maxlength: 600, 'aria-label': 'ملاحظة', dir: 'auto',
        oninput: (e) => { const v = e.target.value.slice(0, 600); const cur = S.dec[q.id]; if (cur) { cur.c = v; if (cur.d === 'note' && !v) delete S.dec[q.id]; } else if (v) S.dec[q.id] = { d: 'note', c: v }; saveState(); } }, (d && d.c) || ''))));

  const bar = h('footer', { class: 'bar' },
    h('div', { class: 'actions' },
      h('button', { type: 'button', class: 'btn primary', disabled: q.ans == null, onclick: () => { setDec(q, 'ok'); afterDecision(); } }, icon(ICON.check), 'أوافق على المقترحة'),
      h('button', { type: 'button', class: 'btn danger', onclick: () => { setDec(q, 'bad'); afterDecision(); } }, icon(ICON.flag), 'معيب'),
      h('button', { type: 'button', class: 'btn', onclick: () => { clearTimeout(advanceTimer); if (d && d.d !== 'note') clearDec(q); goNextPending(); } }, 'تخطّي'),
      h('button', { type: 'button', class: 'btn ico', 'aria-label': 'السؤال السابق', disabled: S.pos === 0, onclick: () => { clearTimeout(advanceTimer); go(-1); } }, icon(ICON.prev)),
      h('button', { type: 'button', class: 'btn ico', 'aria-label': 'السؤال التالي', disabled: S.pos >= list.length - 1, onclick: () => { clearTimeout(advanceTimer); go(1); } }, icon(ICON.next))));
  return [main, bar];
}

function buildExport() {
  const decisions = {};
  for (const [id, d] of Object.entries(S.dec)) {
    const q = BY_ID.get(id); if (!q) continue;
    const row = { d: d.d === 'bad' ? 'invalid' : d.d, h: q.hash };
    if (d.d === 'fix') row.a = d.a;
    if (d.c) row.c = d.c;
    decisions[id] = row;
  }
  return { schema: 'physician-review/1', bankVersion: DATA.version, reviewer: { name: S.reviewer.trim() }, exportedAt: new Date().toISOString(), decisions };
}

function exportView() {
  const c = counts(); const payload = buildExport(); const text = JSON.stringify(payload, null, 1);
  const n = Object.keys(payload.decisions).length;
  const nameInput = h('input', { type: 'text', id: 'reviewer', maxlength: 80, autocomplete: 'name', value: S.reviewer, 'aria-describedby': 'nm-hint',
    oninput: (e) => { S.reviewer = e.target.value.slice(0, 80); S.err = ''; saveState(); } });
  const status = h('p', { class: 'hint', role: 'status', id: 'exp-status' }, S.msg);
  const need = () => { if (!S.reviewer.trim()) { S.err = 'اكتب اسمك أولًا لتُنسب المراجعة إليك.'; render(false); return false; } if (!n) { S.err = 'لا توجد قرارات لتصديرها بعد.'; render(false); return false; } return true; };
  const body = () => JSON.stringify(buildExport(), null, 1);
  const say = (t) => { S.msg = t; status.textContent = t; };
  async function save() {
    if (!need()) return;
    const data = body(); const filename = `physician-review-${new Date().toISOString().slice(0, 10)}.json`;
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename, data }); say('تم عرض الحفظ عليك. أرسل الملف إلى من كلّفك بالمراجعة.'); return; }
    } catch (e) { if (e && e.code === 'declined') { say('ألغيتَ الحفظ.'); return; } }
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = h('a', { href: url, download: filename }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      say('بدأ تنزيل الملف. إن لم ينزل فاستعمل «نسخ النص».');
    } catch { say('تعذّر الحفظ كملف. استعمل «نسخ النص» وأرسله كما هو.'); }
  }
  async function copy() {
    if (!need()) return;
    try { await navigator.clipboard.writeText(body()); say('نُسخ النص. الصقه في رسالة وأرسله.'); }
    catch { const pre = document.getElementById('out'); const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); say('حدّدتُ النص أدناه؛ انسخه بيدك (ضغطة مطوّلة ثم نسخ).'); }
  }
  function openFile(ev) {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    if (f.size > 4e6) { say('الملف كبير جدًا.'); return; }
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(String(r.result));
        if (!j || j.schema !== 'physician-review/1' || typeof j.decisions !== 'object') throw new Error('schema');
        if (j.bankVersion !== DATA.version) { say('هذا الملف من إصدار آخر من الأسئلة ولا يمكن دمجه.'); return; }
        let added = 0;
        const incoming = sanitize({ reviewer: '', dec: Object.fromEntries(Object.entries(j.decisions).map(([id, d]) => [id, { d: d.d === 'invalid' ? 'bad' : d.d, a: d.a, c: d.c }])) });
        for (const [id, d] of Object.entries(incoming.dec)) if (!S.dec[id]) { S.dec[id] = d; added++; }
        if (!S.reviewer && j.reviewer && typeof j.reviewer.name === 'string') S.reviewer = j.reviewer.name.slice(0, 80);
        saveState(); S.msg = `أُضيف ${added} قرارًا من الملف (ما سبق أن قرّرتَه هنا لم يُستبدل).`; render(false);
      } catch { say('الملف ليس قرارات مراجعة صالحة.'); }
    };
    r.readAsText(f);
  }
  const main = h('main', null,
    h('section', { class: 'card' },
      h('div', { class: 'stats' }, h('div', null, h('b', null, c.ok), 'موافقة'), h('div', null, h('b', null, c.fix), 'تصحيح'), h('div', null, h('b', null, c.bad), 'معيبة'), h('div', null, h('b', null, ITEMS.length - c.ok - c.fix - c.bad), 'بلا قرار')),
      h('label', { class: 'lab', for: 'reviewer' }, 'اسمك وصفتك (يُسجَّل مع القرارات)', nameInput, h('span', { class: 'hint', id: 'nm-hint' }, 'مثال: د. فلان، طبيب باطنة')),
      S.err ? h('p', { class: 'err', role: 'alert' }, S.err) : null,
      h('div', { class: 'actions', style: 'grid-template-columns:1fr 1fr' },
        h('button', { type: 'button', class: 'btn brand', onclick: save }, 'حفظ القرارات كملف'),
        h('button', { type: 'button', class: 'btn', onclick: copy }, 'نسخ النص')),
      status,
      h('div', { class: 'notice' }, 'يمكنك التصدير في أي وقت وإكمال المراجعة لاحقًا؛ كل تصدير يحوي كل قراراتك حتى تلك اللحظة.'),
      h('details', null, h('summary', null, 'معاينة النص الذي سيُرسل'), h('pre', { class: 'out', id: 'out' }, text)),
      h('label', { class: 'lab', for: 'openf' }, 'متابعة من ملف قرارات سابق', h('input', { type: 'file', id: 'openf', accept: 'application/json,.json', onchange: openFile }))));
  return [main, null];
}

function render(focusStem) {
  const keepScroll = !focusStem;
  const y = window.scrollY;
  const [main, bar] = S.view === 'review' ? reviewView() : exportView();
  app.replaceChildren(header(), main, ...(bar ? [bar] : []));
  if (keepScroll) window.scrollTo(0, y);
  if (focusStem) { window.scrollTo(0, 0); const el = document.getElementById('stem'); if (el) el.focus({ preventScroll: true }); }
}
render(false);
})();
</script>
