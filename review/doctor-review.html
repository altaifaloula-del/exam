"t":"Stroke recovery - Wikipedia","u":"https://en.wikipedia.org/wiki/Stroke_recovery"}],"hash":"5c3657e3"},{"id":"Q0578","spec":"nursing","type":"mcq","lang":"en","q":"During the second day of hospitalization of the client after a Myocardial Infarction. Which of the following is an expected outcome?","qar":null,"options":["Able to perform self-care activities without pain","Severe chest pain","Can recognize the risk factors of Myocardial Infarction","Can Participate in cardiac rehabilitation walking program."],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"لا يوجد مرجع حاسم؛ في اليوم الثاني بعد احتشاء العضلة القلبية المتوقع: خلو المريض من الألم وقيامه بالعناية الذاتية، أما معرفة عوامل الخطورة فتعليم لاحق والمشي في برنامج التأهيل أبعد؛ إجابة المصدر (الخيار 3) مؤشَّر عليها «ambiguous» فأخالفها بثقة منخفضة.","src_disagrees":true,"refs":[{"t":"Cardiac rehabilitation - Wikipedia","u":"https://en.wikipedia.org/wiki/Cardiac_rehabilitation"},{"t":"Myocardial Infarction - StatPearls (NCBI Bookshelf NBK537076)","u":"https://www.ncbi.nlm.nih.gov/books/NBK537076/"}],"hash":"374853c2"},{"id":"Q0579","spec":"nursing","type":"mcq","lang":"en","q":"A female client is taking Cascara Sagrada. Nurse Betty informs the client that the following may be experienced as side effects of this medication:","qar":null,"options":["GI bleeding","Peptic ulcer disease","Abdominal cramps","Partial bowel obstruction."],"ans":2,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"المغص/التقلصات البطنية أثر جانبي معروف للملينات المحفّزة مثل الكاسكارا ساجرادا، أما النزف الهضمي وقرحة المعدة والانسداد الجزئي فمحاذير استعمال لا آثار جانبية؛ المرجع الذي اطلعت عليه يذكر الإسهال الشديد والجفاف ولا ينص على المغص صراحةً.","src_disagrees":false,"refs":[{"t":"Cascara sagrada - Wikipedia","u":"https://en.wikipedia.org/wiki/Cascara_sagrada"}],"hash":"c1dae84d"},{"id":"Q0584","spec":"nursing","type":"mcq","lang":"en","q":"A social nurse educates people in the rural about reducing _ limit _ the spread of encephalitis ....by","qar":null,"options":["vaccination.","Do not leave the house at night","Spray pesticides to kill mosquito.","Wear gloves when working in the garden."],"ans":2,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"النص مبتور؛ رأيت أن «الحد من الانتشار» يوافق مكافحة البعوض برش المبيدات (مفتاح محتمل)، لكن منظمة الصحة تعطي أولوية لتطعيم البشر في التهاب الدماغ الياباني (الخيار 1)، فالسؤال مرهون بنوع الالتهاب المقصود.","src_disagrees":false,"refs":[{"t":"Japanese encephalitis - WHO fact sheet","u":"https://www.who.int/news-room/fact-sheets/detail/japanese-encephalitis"},{"t":"Japanese Encephalitis prevention - CDC","u":"https://www.cdc.gov/japanese-encephalitis/prevention/index.html"}],"hash":"780cef8e"},{"id":"Q0588","spec":"nursing","type":"mcq","lang":"en","q":"An emergency patient is bleeding from his head after an accident, to stop the bleeding you will press....","qar":null,"options":["Facial artery.","Temporal artery.","Radial artery.","femoral artery."],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"نقطة الضغط للنزف من فروة الرأس هي الشريان الصدغي السطحي (بينما الوجهي للوجه والكعبري واليد والفخذي للطرفين)؛ ويبقى الضغط المباشر على الجرح هو الإسعاف الأساسي في المراجع الحديثة.","src_disagrees":false,"refs":[{"t":"Superficial temporal artery - Wikipedia","u":"https://en.wikipedia.org/wiki/Superficial_temporal_artery"}],"hash":"f5668045"},{"id":"Q0589","spec":"nursing","type":"mcq","lang":"en","q":"patient is admitted to the emergency department with a spinal cord injury at the level of T2. Which finding is of most concern to the nurse?","qar":null,"options":["SpO2 of 92%","Heart rate of 42 bpm","Blood pressure of 88/60 mm Hg","Loss of motor and sensory function in arms and legs."],"ans":1,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"إصابة النخاع فوق T6 تسبب صدمة عصبية (هبوط ضغط مع بطء قلب)؛ أرجّح أن بطء القلب 42 هو الأخطر (خطر توقف القلب)، أما ضغط 88/60 فهو أيضًا مقلق، وفقد الحركة في الذراعين لا يناسب مستوى T2؛ لم أجد مفتاحًا موثوقًا للسؤال.","src_disagrees":false,"refs":[{"t":"Neurogenic Shock - StatPearls (NCBI Bookshelf NBK459361)","u":"https://www.ncbi.nlm.nih.gov/books/NBK459361/"}],"hash":"b1e6b27f"},{"id":"Q0590","spec":"nursing","type":"mcq","lang":"en","q":"When teaching the patient with diabetes about insulin administration, the nurse should include which instruction for the patient?","qar":null,"options":["Pull back on the plunger after inserting the needle to check for blood.","Consistently use the same size of insulin syringe to avoid dosing errors.","Clean the skin at the injection site with an alcohol swab before each injection.","Rotate injection sites from arms to thighs to abdomen with each injection to prevent lipodystrophies."],"ans":1,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"سحب المكبس للتأكد من الدم غير مطلوب، والتبديل بين مناطق مختلفة مع كل حقنة غير مستحسن (يُبدَّل الموضع داخل المنطقة نفسها) وتنظيف الجلد بالكحول اختياري عند نظافته؛ فبالاستبعاد يبقى استخدام حجم المحقنة نفسه لتفادي أخطاء الجرعة (مفتاح Lewis المرجّح)، دون مرجع يؤكد ذلك نصًا.","src_disagrees":false,"refs":[{"t":"Insulin, Medicines & Other Diabetes Treatments - NIDDK","u":"https://www.niddk.nih.gov/health-information/diabetes/overview/insulin-medicines-treatments"}],"hash":"991915f6"},{"id":"Q0592","spec":"nursing","type":"mcq","lang":"en","q":"patient with ulcerative colitis undergoes the first phase of a total proctocolectomy with ileal pouch and analanastomosis. On postoperative assessment of the patient, what should the nurse expect to find?","qar":null,"options":["A rectal tube set to low continuous suction","A loop ileostomy with a plastic rod to hold it in place","A colostomy stoma with an NG tube in place to provide pouch irrigations","A permanent ileostomy stoma in the right lower quadrant of the abdomen."],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"المرحلة الأولى من استئصال القولون والمستقيم مع الكيس اللفائفي تشمل فغر لفائفي مؤقتًا من النوع الحلقي (loop) لحماية الكيس أثناء الالتئام ثم يُغلق في المرحلة الثانية؛ وليس دائمًا ولا فغر قولون.","src_disagrees":false,"refs":[{"t":"Ileo-anal pouch - Wikipedia","u":"https://en.wikipedia.org/wiki/Ileo-anal_pouch"}],"hash":"4aec1c59"},{"id":"Q0594","spec":"nursing","type":"mcq","lang":"en","q":"The patient comes to the emergency department with intermittent crampy abdominal pain, nausea, projectile vomiting, and dehydration. The nurse suspects a GI obstruction. Based on the manifestations, what area of the bowel should the nurse suspect is obstructed?","qar":null,"options":["Large intestine","Esophageal sphincter","Upper small intestine","Lower small intestine."],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"القيء المبكر الغزير (القذفي) مع مغص متقطع وجفاف يدل على انسداد الأمعاء الدقيقة العلوية (proximal)، بينما يغلب الإمساك والانتفاخ في الانسداد السفلي.","src_disagrees":false,"refs":[{"t":"Bowel obstruction - Wikipedia","u":"https://en.wikipedia.org/wiki/Bowel_obstruction"}],"hash":"b7059df8"},{"id":"Q0604","spec":"nursing","type":"mcq","lang":"ar","q":"مريض عمرة ٦٧ عاما ادخل إلى القسم يعاني من (COPD) الإمراض الرئوية الانسدادية المزمنة أي من الأمور التالية يجب على الممرض مراعاتها عند وضع خطة الرعاية بهذا المريض:","qar":null,"options":["إعطاء الأكسوجين ١٠ لتر عن طريق الأنبوب الأنفي","الطلب من المريض الراحة وعدم الإجهاد الجسمي","تحديد كمية السوائل المعطاة للمريض","وضع المريض في غرفة العزل التنفسي ."],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"بالحذف: الأكسجين في COPD منخفض التدفق (1–2 لتر/د وليس 10 لترات) ويُشجَّع شرب السوائل ولا تُقيَّد، ولا حاجة لعزل تنفسي؛ فيبقى الراحة وحفظ الطاقة وتقليل الجهد كمكوّن أساسي في الخطة. المرجع تمريضي تعليمي فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"COPD Nursing Care Plan: Diagnoses, Interventions & Rationales (RNspeak)","u":"https://rnspeak.com/copd-nursing-care-plan/"}],"hash":"1ffa5e24"},{"id":"Q0607","spec":"nursing","type":"mcq","lang":"ar","q":"عند ادخال center venous catheter أي من الأوضاع التالية يجب وضع المريض بها :","qar":null,"options":["supaine","trendelenburg","reverse trendelenburg","high- fowlers"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"يُوضع المريض في وضعية ترندلنبرغ (رأس منخفض 10–30 درجة) أثناء إدخال القسطرة الوريدية المركزية لرفع الضغط الوريدي المركزي وتقليل خطر الصمة الهوائية.","src_disagrees":false,"refs":[{"t":"Reducing Risk of Air Embolism Associated with Central Venous Access Devices (Pennsylvania Patient Safety Authority)","u":"https://patientsafety.pa.gov/ADVISORIES/Pages/201206_58.aspx"}],"hash":"b7ce4bef"},{"id":"Q0608","spec":"nursing","type":"mcq","lang":"ar","q":"وصف الطبيب دواء tagament (cimetidine) لمريض يعاني من قرحة معدية نازفة أي مما يلي يعتبر صحيحا لوصف هذا الدواء","qar":null,"options":["يعمل هذا الدواء على تثبيط إفراز حمض المعدة gastric hydrochoric acid","يعمل على حماية الأغشية المخاطية من التلف","يزيد من افرازات المعدة القاعدية","يزيد من قدرة المعدة على امتصاص المواد الغذائية ."],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"السيميتيدين (تاغاميت) حاصر لمستقبلات H2 يثبّط إفراز حمض المعدة من الخلايا الجدارية، ويُستعمل في قرحة المعدة/الاثني عشر ومنع النزف الهضمي العلوي.","src_disagrees":false,"refs":[{"t":"Cimetidine - StatPearls","u":"https://www.statpearls.com/point-of-care/42966"}],"hash":"6bf5429a"},{"id":"Q0609","spec":"nursing","type":"mcq","lang":"ar","q":"أدخل المريض إلى غرفة الأفاقة ( recovery room ) بعد إجراء عملية استئصال الزائدة الدودية له على الممرض قياس العلامات الحيوية لهذا المريض كل :","qar":null,"options":["٥ دقائق","١٥ دقيقة","ساعتين","عند الضرورة فقط"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"العلامات الحيوية بعد الجراحة تُقاس كل 15 دقيقة على الأقل حتى استقرار الحالة (ثم تُباعد). المراجع تمريضية تعليمية فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Care of Postoperative Patients (Nurse Key)","u":"https://nursekey.com/care-of-postoperative-patients/"},{"t":"PACU Nursing Priorities: The First Hour After Surgery (RN-Nurse)","u":"https://rn-nurse.com/pacu-nursing-priorities-first-hour/"}],"hash":"2c8dce67"},{"id":"Q0610","spec":"nursing","type":"mcq","lang":"ar","q":"عند تحضير الممرضة لإعطاء دواء ما قبل العملية قام الطبيب بوصفه ( فاليوم ١٠ ملغم عن طريق الفم ) لمريضة سيتم إجراء عملية استئصال الرحم لها ، اخبرت هذه المريضة الممرضة بأنها وزوجها يخططان لإنجاب طفل في السنوات القادمة ، ما أفضل إجراء للممرضة يجب عليها اتخاذه عند سماعها لهذا الكلام :","qar":null,"options":["عدم إعطاء الدواء وإخبار الممرضة المسئولة والطبيب","إعطاء الدواء كما هو موصوف .","التأكد من توقع المريضة على النموذج الخاص بالعمليات .","إرسال المريضة إلى غرفة العمليات بدون إعطاء الدواء."],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"كلام المريضة عن رغبتها بالإنجاب بعد استئصال الرحم يدل على سوء فهم للعملية (موافقة مستنيرة غير صحيحة)؛ على الممرض تعليق الدواء المهدّئ وإبلاغ الممرضة المسؤولة والطبيب لتوضيح الأمر قبل المتابعة. المرجع تمريضي تعليمي.","src_disagrees":false,"refs":[{"t":"Preoperative Phase - Perioperative Nursing (Nurseslabs)","u":"https://nurseslabs.com/preoperative-phase/"}],"hash":"fe8c09b3"},{"id":"Q0611","spec":"nursing","type":"mcq","lang":"ar","q":"عند احضار مريض أجرى له عملية جراحية من غرفة الإفاقة إلى القسم أي من الأمور التالية على الممرض تقديمها بشكل فوري عند وصول المريض:","qar":null,"options":["تقييم مكان العملية.","تقييم كمية البول والسوائل الوريدية","تقييم حالة المريض النفسية","اخذ العلامات الحيوية وتقييم مجرى الهواء ومعدل التنفس ."],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"أول أولوية عند استلام المريض بعد الجراحة هي تقييم مجرى الهواء والتنفس والعلامات الحيوية (ABC) قبل تقييم الجرح أو البول أو الحالة النفسية. (السؤال فيه خطأ نسخ بسيط لا يغيّر الحكم.)","src_disagrees":false,"refs":[{"t":"Care of Postoperative Patients (Nurse Key)","u":"https://nursekey.com/care-of-postoperative-patients/"},{"t":"PACU Nursing Priorities: The First Hour After Surgery (RN-Nurse)","u":"https://rn-nurse.com/pacu-nursing-priorities-first-hour/"}],"hash":"a7b46c0c"},{"id":"Q0612","spec":"nursing","type":"mcq","lang":"ar","q":"مريض فصيلة دمه AB ويحتاج إلى نقل دم أي من الإجابات التالية صحيحة:","qar":null,"options":["يأخذ المريض دم من فصيلة A و B","يأخذ المريض دم من فصيلة AB","يأخذ المريض دم من فصيلة O فقط","يأخذ المريض دم من فصيلة A,B,O,AB"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"فصيلة AB موجب هي المستقبِل العام لكريات الدم الحمراء: يمكن أن يتلقى كريات من A وB وAB وO (حسب توافق Rh).","src_disagrees":false,"refs":[{"t":"Blood Types (American Red Cross)","u":"https://www.redcrossblood.org/donate-blood/blood-types.html"}],"hash":"32e1317b"},{"id":"Q0613","spec":"nursing","type":"mcq","lang":"ar","q":"أي من الأمور التالية أكثر أهمية على الممرض مراقبتها عند المرضى الذين يتعالجون بالأدوية الكيماوية (chemotherapy)","qar":null,"options":["قياس درجة الحرارة عن طريق الشرج كل ٤ ساعات","تقييم العلامات الحيوية كل ٨ ساعات.","مراقبة قيء المريض إذا كان يحتوي على دم","تجنب إعطاء المريض خضروات وفواكه طازجة ."],"ans":2,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"الخيارات كلها ضعيفة: قياس الحرارة شرجيًا ممنوع عند نقص العدلات، والعلامات الحيوية كل 8 ساعات قليلة جدًا، وتجنّب الفواكه والخضار الطازجة محصور بغير المغسولة/غير المطبوخة. مراقبة النزف (تقيّؤ دموي) من أثر نقص الصفيحات والتهاب الغشاء المخاطي أقرب خيار مراقبة، لكن لا مرجع يحدد هذا الخيار بدقة.","src_disagrees":false,"refs":[{"t":"Care of the Patient with Cancer - Medical-Surgical Nursing (OpenStax)","u":"https://openstax.org/books/medical-surgical-nursing/pages/31-3-care-of-the-patient-with-cancer"},{"t":"Neutropenia Treatment & Management (Medscape)","u":"https://emedicine.medscape.com/article/204821-treatment"}],"hash":"adcfafc3"},{"id":"Q0614","spec":"nursing","type":"mcq","lang":"ar","q":"عند تقديم الرعاية لمريض يتعالج بالأشعة (radiation therapy) على الممرض تقييم أي من الآثار الجانبية التالية :","qar":null,"options":["الوذمة ( تجمع السوائل في الجسم )","الإنتانات والنزيف .","التحسس من العلاج","ارتفاع في درجة الحرارة"],"ans":1,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"السؤال عام: الآثار الشائعة للعلاج الإشعاعي هي الإرهاق والتهاب الجلد الموضعي، أما هبوط الدم (عدوى ونزف) فنادر ويزيد مع العلاج الكيماوي المرافق أو تشعيع مناطق النخاع الكبيرة. لا خيار صحيح تمامًا؛ الخيار المعلَّم هو الأقرب تمريضيًا بالحذف (الحساسية والحمى ليسا أثرًا نموذجيًا) بثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Radiation Therapy Side Effects (American Cancer Society)","u":"https://www.cancer.org/cancer/treatment-types/radiation/effects-on-different-parts-of-body.html"}],"hash":"a4343edc"},{"id":"Q0615","spec":"nursing","type":"mcq","lang":"ar","q":"أي من التالي يعتبر من العوامل المساعدة على الإصابة بفقر الدم الخبيث :","qar":null,"options":["فقدان الدم الحاد","وجود المرض في العائلة ( تاريخ مرضي عائلي ايجابي)","الإنتانات","نقص في كمية الدم الحاد"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"من عوامل خطر فقر الدم الخبيث وجود تاريخ عائلي للمرض (استعداد وراثي/مناعة ذاتية)؛ أما النزف الحاد والإنتانات فتسبب أنواعًا أخرى من فقر الدم.","src_disagrees":false,"refs":[{"t":"Anemia, Pernicious (NORD)","u":"https://rarediseases.org/rare-diseases/anemia-pernicious/"},{"t":"What are the Risk Factors for Pernicious Anemia (Hematology Oncology Associates of CNY)","u":"https://www.hoacny.com/patient-resources/blood-disorders/what-pernicious-anemia/what-are-risk-factors-pernicious-anemia"}],"hash":"ef7145ce"},{"id":"Q0616","spec":"nursing","type":"mcq","lang":"ar","q":"أثناء دخولك إلى غرفة المريض لاحظت أن أنبوب النزح الصدري chest tube قد خرج من صدر المريض أي من الإجراءات التالية يجب عليك اتخاذه فورا :","qar":null,"options":["وضع شاش لاصق مكان فتحة الأنبوب لتغطيتها .","إخبار الطبيب","الطلب من المريض اخذ نفس عميق لحين وصول المساعدة .","إعادة الأنبوب إلى مكانه الصحيح"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"عند خروج أنبوب الصدر يُغطّى الموضع فورًا بضماد معقّم (يُلصق من ثلاث جهات لتفادي استرواح الصدر الضاغط) ثم يُبلَّغ الطبيب؛ إعادة إدخال الأنبوب ممنوعة على الممرض. المراجع تمريضية تعليمية فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Managing chest tubes: Air leaks and unplanned tube removal (American Nurse)","u":"https://www.myamericannurse.com/managing-chest-tubes-air-leaks-unplanned-tube-removal/"},{"t":"Nursing Responsibilities for Clients With Chest Tube Drainage Systems (WTCS Nursing Advanced Skills)","u":"https://wtcs.pressbooks.pub/nursingadvancedskills/chapter/6-3-nursing-responsibilities-for-clients-with-chest-tube-drainage-systems/"},{"t":"Chest Tubes NCLEX Review (RegisteredNurseRN)","u":"https://www.registerednursern.com/chest-tubes-nclex-review/"}],"hash":"efd52bde"},{"id":"Q0619","spec":"nursing","type":"mcq","lang":"ar","q":"لتحسين حالة التنفس للمريض عند نزع الانبوب الصدري له على الممرض ارشاد المريض الى:","qar":null,"options":["البقاء في وضعية الاستلقاء الظهري","الطلب من المريض البقاء في الوضع الجانبي لمدة ساعتين","تشجيع المريض على السعال اوتمرينات التنفس العميق *","تشجيع المريض على الراحة في السرير وعدم الحركة"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"بقية الخيارات (الاستلقاء الظهري أو الجانبي ساعتين أو الراحة دون حركة) تقلل توسّع الرئة؛ بعد نزع الأنبوب يُشجَّع المريض على الجلوس/الوضع شبه المعتدل والتنفس العميق والسعال مع مراقبة الحالة التنفسية. المراجع لا تنص حرفيًا على التعليمة فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Assisting With Chest Tube Removal (WTCS Nursing Advanced Skills)","u":"https://wtcs.pressbooks.pub/nursingadvancedskills/chapter/6-8-assisting-with-chest-tube-removal/"},{"t":"Managing chest tubes: Air leaks and unplanned tube removal (American Nurse)","u":"https://www.myamericannurse.com/managing-chest-tubes-air-leaks-unplanned-tube-removal/"}],"hash":"4b9f60e6"},{"id":"Q0620","spec":"nursing","type":"mcq","lang":"ar","q":"عند نقل المريض الى قسم الاشعة لاجراء تصوير له بدا متأثرا ومشوش وتبين بان الانبوب الصدري قد خرج من مكانه ما هو اول اجراء على الممرض اتخاذه في مثل هدة الحالة:","qar":null,"options":["وضع المريض على جنبه الايمن فورا","وضع شا ش معقم مكان خروج الانبوب","تغطية مكان خروج الانبوب بقطعة قماش نظيفة *","محاولة اعادو الانبوب الى مكانة ."],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["corrected","general"],"note":"المراجع تنص على تغطية الموضع فورًا بضماد/شاش معقّم (يفضّل مشمّع بالفازلين ويُلصق من 3 جهات) ثم إبلاغ الطبيب؛ القماش النظيف مقبول فقط كحل اضطراري إن لم يتوفر معقّم. لذا الأنسب الخيار الثاني (شاش معقّم) وليس القماش النظيف. ثقة متوسطة لأن نصّ السؤال يجعل الخيارين تغطية أولية.","src_disagrees":true,"refs":[{"t":"Managing chest tubes: Air leaks and unplanned tube removal (American Nurse)","u":"https://www.myamericannurse.com/managing-chest-tubes-air-leaks-unplanned-tube-removal/"},{"t":"Nursing Responsibilities for Clients With Chest Tube Drainage Systems (WTCS Nursing Advanced Skills)","u":"https://wtcs.pressbooks.pub/nursingadvancedskills/chapter/6-3-nursing-responsibilities-for-clients-with-chest-tube-drainage-systems/"},{"t":"Chest Tubes NCLEX Review (RegisteredNurseRN)","u":"https://www.registerednursern.com/chest-tubes-nclex-review/"}],"hash":"efb27b3f"},{"id":"Q0621","spec":"nursing","type":"mcq","lang":"ar","q":"انت ممرض في قسم الطوارئ تم اخبارك بان هنالك مريض مصاب بطلق ناري في منطقة الصدر في طريقة الى الوصول الى القسم اي من الامور التالية عليك التخطيط للقيام بها فورا:","qar":null,"options":["تجهيز غرفة العمليات","تحضير ادوات فتح الرغام","اخبار قسم الاشعة للتحضير لتصوير المريض","تحضير ادوات الانبوب الصدري*"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الإصابة الناريّة في الصدر غالبًا تسبب استرواحًا/تدمّيًا صدريًا والعلاج الأولي هو التفريغ بأنبوب صدري (tube thoracostomy)، لذا يُجهَّز طقم الأنبوب الصدري فورًا؛ غرفة العمليات والأشعة تأتي لاحقًا وليس الرغامى (Tracheostomy).","src_disagrees":false,"refs":[{"t":"Hemothorax Treatment & Management (Medscape)","u":"https://emedicine.medscape.com/article/2047916-treatment"}],"hash":"2518e738"},{"id":"Q0622","spec":"nursing","type":"mcq","lang":"ar","q":"من اوليات الرعاية بعد عملية استئصال الحنجرة للمريض laryngectomy:","qar":null,"options":["الدعم النفسي للمريض","مراقبة علامات الانتانات","المحافظة على بقاء القصبة الهوائية خالية من الافرازات *","ايجاد الطريقة المناسبة للاتصال مع المصاب"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"أولوية الرعاية بعد استئصال الحنجرة هي الحفاظ على سالكية الطريق الهوائي (فغرة الرغامى خالية من الإفرازات والسدادات المخاطية التي قد تسبب انسدادًا مهددًا للحياة)، ثم تأتي الاتصال والدعم النفسي.","src_disagrees":false,"refs":[{"t":"Nursing Process: The Patient Undergoing Laryngectomy (Brunner & Suddarth excerpt, BrainKart)","u":"https://www.brainkart.com/article/Nursing-Process--The-Patient-Undergoing-Laryngectomy_31826/"},{"t":"Post Laryngectomy Stoma Care (Physiopedia)","u":"https://www.physio-pedia.com/Post_Laryngectomy_Stoma_Care"}],"hash":"4b704d4a"},{"id":"Q0623","spec":"nursing","type":"mcq","lang":"ar","q":"للتأكد من حصول المريض على تهوية جيدة وكافية بعد العملية ما هي اهم المداخلات الواجب على الممرض اجراءها:","qar":null,"options":["اعطاء المريض الاكسجين عبر الانبوب الانفي","وضع المريض في الوضع الجانبي مع مد الرقبة","مراقبة حالة الرئتين باستخدام السماعة","تقييم تنفس المريض كل ساعتين"],"ans":2,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"لا مرجع يحدد الخيار الأدق: الهدف هو التأكد من كفاية التهوية، وأفضل وسيلة تقييم عملية هي فحص الرئتين بالسماعة مع مراقبة التنفس المستمر؛ الأكسجين وحده لا يثبت كفاية التهوية، وتقييم كل ساعتين متباعد جدًا. الإجابة مرجّحة بثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Care of Postoperative Patients (Nurse Key)","u":"https://nursekey.com/care-of-postoperative-patients/"}],"hash":"398a1d85"},{"id":"Q0624","spec":"nursing","type":"mcq","lang":"ar","q":"بعد عودة المريض من اجراء تنظير للقصبات الهوائية (laryngectomy) على الممرض ايقاف السوائل والطعام عن المريض لعدة ساعات اهم الاسباب لهذا الاجراء:","qar":null,"options":["خوفا حدوث الاختناق عند المريض *","بسبب احتمالية حدوث تقيء عند المريض","وجود صعوبة في حركة الامعاء عند المريض","وجود الم في البطن عند المريض"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"بعد تنظير القصبات يُخدَّر البلعوم ويضعف منعكس البلع/التهوع مؤقتًا، لذا يُمنع الطعام والشراب حتى عودته منعًا للاختناق والاستنشاق. (السؤال كتب laryngectomy خطأً والمقصود bronchoscopy.)","src_disagrees":false,"refs":[{"t":"Bronchoscopy (Johns Hopkins Medicine)","u":"https://www.hopkinsmedicine.org/health/treatment-tests-and-therapies/bronchoscopy"}],"hash":"f4231078"},{"id":"Q0626","spec":"nursing","type":"mcq","lang":"ar","q":"ادخل مريض إلى القسم وكانت نتائج فحوصات الدم المخبرية عنده كما يلي : Platelets 300,000 , WBC 3000 , RBC5000,000 أي من الاعتبارات التالية على الممرض أن يهتم بها أولا :","qar":null,"options":["اخذ العلامات الحيوية للمريض كل ١٥ دقيقة","منع حدوث العدوى","تقييم الألم عند المريض","إعطاء الأغذية الغنية بالحديد للمريض ."],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"كريات الدم البيضاء 3000 أقل من الطبيعي (4500–11000) أي قلة كريات بيض وضعف مناعة، بينما الصفيحات والكريات الحمراء طبيعية؛ فالأولوية التمريضية منع العدوى.","src_disagrees":false,"refs":[{"t":"WBC count (UCSF Health)","u":"https://www.ucsfhealth.org/care/medical-tests/wbc-count"}],"hash":"ef63575d"},{"id":"Q0628","spec":"nursing","type":"mcq","lang":"ar","q":"عند تطبيق الجبس على أحد الاطراف على الممرض مراقبة المضاعفات التي قد تحدث عند المريض نتيجة تطبيق الجبس ما هي اهم المضاعفات التي على الممرض تقييمها اولا:","qar":null,"options":["وجود حرارة في الطرف","تنمل الاطراف*","تشوة الجلد","عدم الراحة"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"أهم مضاعفات الجبس الضغط على الأعصاب والأوعية (متلازمة الحيز): التنميل والوخز من علامات الإصابة العصبية الوعائية المبكرة. ثقة متوسطة لأن أهم علامة عند بعض المراجع هي الألم غير المتناسب وهو غير وارد في الخيارات.","src_disagrees":false,"refs":[{"t":"Neurovascular observations (Royal Children's Hospital Melbourne clinical guideline)","u":"https://www.rch.org.au/rchcpg/hospital_clinical_guideline_index/Neurovascular_observations/"}],"hash":"48487f4a"},{"id":"Q0629","spec":"nursing","type":"mcq","lang":"ar","q":"بعد اجراء عملية في العمود الفقري( الجراحات الشوكية ) للمريض ما هو الاجراء الضروري الذي على الممرض القيام به :","qar":null,"options":["تشجيع المريض على تناول السوائل","وضع المريض في وضعية نصف الجلوس","تقييم الاطراف السفلى للمريض الدورة الدموية والاحساس .*","مراقبة حركة الامعاء عند المريض"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"بعد جراحة العمود الفقري يُقيَّم الحالة العصبية والدورة الدموية والإحساس والحركة في الأطراف السفلية للكشف المبكر عن ضغط أو نزف على الحبل الشوكي.","src_disagrees":false,"refs":[{"t":"Laminectomy (Disc Surgery) Nursing Care Plans (Nurseslabs)","u":"https://nurseslabs.com/laminectomy-disc-surgery-nursing-care-plans/"}],"hash":"b2c1fa36"},{"id":"Q0630","spec":"nursing","type":"mcq","lang":"ar","q":"بعد اجراء عملية بديل الورك الكلي ( total hip replacement ) لمريض عمرة ٧٣ عام على الممرض ان يتوقع اي من المضاعفات التالية لمرضى الحوض:","qar":null,"options":["النزيف","قصور التنفس","انتان الجرح","pulmonary embolism * الجلطة الرئوية"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الخثار الوريدي العميق والصمة الرئوية من أهم وأشيع المضاعفات بعد استبدال مفصل الورك (35–84% دون وقاية)؛ أما عدوى الجرح العميقة فحوالي 1%. ثقة متوسطة لأن النزف والعدوى من المضاعفات المتوقعة أيضًا.","src_disagrees":false,"refs":[{"t":"Prevention of early complications following total hip replacement (SICOT-J)","u":"https://www.sicot-j.org/articles/sicotj/full_html/2021/01/sicotj210046/sicotj210046.html"}],"hash":"fd64d456"},{"id":"Q0631","spec":"nursing","type":"mcq","lang":"ar","q":"بعد نزع الجبس الذي تم موضعة لمدة طويلة على الممرض ارشاد المريض الى :","qar":null,"options":["الاخبار عن عدم الراحة اذاوجد","تنظيف القدم بحركة دائرية","رفع القدم عند الجلوس لفترات طويلة *","تحريك القدم بحركة دائرية ٣ مرات يوميا"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"بعد نزع الجبس يتورم الطرف لذا يُنصح برفعه وتخفيف النشاط؛ والتنظيف يكون بلطف دون فرك. المرجع لطب الأطفال لكنه يطبّق عمليًا على الحالة فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Care Following Cast Removal (Rady Children's Health)","u":"https://www.rchsd.org/programs-services/orthopedics-scoliosis/patient-and-parent-education/care-following-cast-removal/"}],"hash":"232b4714"},{"id":"Q0632","spec":"nursing","type":"mcq","lang":"ar","q":"اثناء رعاية المريض بعد اجراء عملية للبروستات اي من المضاعفات التالية على الممرض مراقبتها بعناية:","qar":null,"options":["الانتانات","النزيف","تجمع الصديد حول الانبوب","احتباس البول عند المريض"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"النزف أشيع مضاعفات ما بعد عمليات البروستات (استئصال عبر الإحليل TURP وغيره) ويُراقَب بلون البول في السقاية المستمرة والعلامات الحيوية؛ العدوى وانحباس البول (بالجلطات) ممكنان لكنهما أقل أولوية. ثقة متوسطة لأن السؤال لا يحدد نوع العملية.","src_disagrees":false,"refs":[{"t":"TURP: when do we perform surgery and potential complications (American Nurse)","u":"https://www.myamericannurse.com/turp-transurethral-resection-of-the-prostate/"},{"t":"Transurethral resection of the prostate (Wikipedia)","u":"https://en.wikipedia.org/wiki/Transurethral_resection_of_the_prostate"}],"hash":"dd5d7370"},{"id":"Q0633","spec":"nursing","type":"mcq","lang":"ar","q":"اي من المضاعفات التالية الاخطر لمريض مصاب بفشل كلوي حاد:","qar":null,"options":["النزيف *","الانتانات","نقصان الوزن","زيادة التبول"],"ans":1,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"المراجع لا تدعم النزف كأخطر مضاعفات الفشل الكلوي الحاد: الإنتان/العدوى هو السبب الأشيع للوفاة (AMBOSS وStatPearls)، كما تُعدّ فرط بوتاسيوم الدم والوذمة الرئوية الأخطر فوريًا (Merck) وهما غير واردين بين الخيارات. أرجّح الإنتانات بثقة منخفضة والمراجع التمريضية قد تختلف.","src_disagrees":true,"refs":[{"t":"Acute kidney injury (AMBOSS)","u":"https://www.amboss.com/us/knowledge/acute-kidney-injury"},{"t":"Acute Kidney Injury / Acute Renal Failure - StatPearls (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/books/NBK441896/"},{"t":"Acute Kidney Injury (Merck Manual Professional Edition)","u":"https://www.merckmanuals.com/professional/nephrology/acute-kidney-injury/acute-kidney-injury-aki"}],"hash":"02355d37"},{"id":"Q0634","spec":"nursing","type":"mcq","lang":"ar","q":"من فوائد شرب عصير التوت البري لمريض يعاني من انتانات المجاري البولية:","qar":null,"options":["خفض نسبة حموضة البول PH*","طرد البكتيريا المسببة للإنتان","تحسين عملية الفلترة","التقليل من الاعراض والعلامات"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"الكتب التمريضية التقليدية تقول إن عصير التوت البري يحمّض البول، لكن المراجع الحديثة (NCCIH) تُرجع الفائدة إلى منع التصاق البكتيريا بجدار المثانة وليس تحميض البول، وهو للوقاية لا علاج عدوى قائمة. أُبقي الخيار الأول لأنه إجابة المقرر التقليدية بثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Cranberry (NCCIH, NIH)","u":"https://www.nccih.nih.gov/health/cranberry"}],"hash":"9c25aaf2"},{"id":"Q0635","spec":"nursing","type":"mcq","lang":"ar","q":"التشخيص التمريضي المناسب لمريض يعاني من التهاب القولون المتقرح (ulcerative colitis) هو:","qar":null,"options":["الم في منطقة البطن مرتبط بضعف في حركة الأمعاء","الإسهال مرتبط بزيادة امتصاص المواد الغذائية في الأمعاء","زيادة السوائل في الجسم مرتبط بزيادة امتصاص الماء في الأمعاء","الحد من نشاطات المريض مرتبط بالشعور بالتعب عام"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الخيارات الثلاثة الأخرى خاطئة فسيولوجيًا (التهاب القولون القرحي يزيد حركة الأمعاء ويسبب إسهالًا ونقص سوائل لا زيادة امتصاص)، بينما الإرهاق وعدم تحمّل النشاط تشخيص تمريضي مُدرج لهذا المرض. ثقة متوسطة (الحكم بالحذف).","src_disagrees":false,"refs":[{"t":"Inflammatory Bowel Disease Nursing Care Plans (Nurseslabs)","u":"https://nurseslabs.com/inflammatory-bowel-disease-nursing-care-plans/"}],"hash":"bd1b74d4"},{"id":"Q0637","spec":"nursing","type":"mcq","lang":"ar","q":"أجرى لمريض عملية بسور hemorrhoidectomy أي من التعليمات التالية يجب على الممرض إعطاءها للمريض:","qar":null,"options":["يجب على المريض التقليل من السوائل لعدة أيام بعد العملية","على المريض زيادة تناول المواد الغذائية مثل الفواكه والخضروات والمواد الغنية بالألياف","تنظيف منطقة العملية يوميا","الحد من النشاطات لمنع حدوث نزيف"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"بعد استئصال البواسير يُنصح بزيادة الألياف والسوائل والملينات لتجنب الإمساك والجهد أثناء التبرز؛ تقليل السوائل خطأ.","src_disagrees":false,"refs":[{"t":"Hemorrhoidectomy: What to Expect at Home (MyHealth Alberta)","u":"https://myhealth.alberta.ca/Health/aftercareinformation/pages/conditions.aspx?hwid=ud1119"}],"hash":"0dff8a5a"},{"id":"Q0638","spec":"nursing","type":"mcq","lang":"ar","q":"أي من الإجراءات التالية تحد من الإصابة بانتانات المجاري البولية لمريض تم تركيب قثطار للبول له:","qar":null,"options":["إبقاء كيس البول حتى يمتلئ كامل ثم تغيره","وصل كيس بول حجم كبير خلال الليل","تحديد السوائل التي يأخذها المريض","تغيير كيس البول كل ٤ ساعات"],"ans":1,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"CDC توصي بالمحافظة على النظام المغلق وتفريغ الكيس بانتظام وعدم فصل الوصلات؛ وهذا يستبعد انتظار امتلائه تمامًا وتغييره كل 4 ساعات (فصل متكرر)، كما أن تقييد السوائل غير مطلوب. كيس كبير ليلًا متسق مع ذلك لكن لا نص حرفيًا عليه فثقة منخفضة.","src_disagrees":false,"refs":[{"t":"CDC Guideline for Prevention of Catheter-associated Urinary Tract Infections","u":"https://www.cdc.gov/infection-control/media/pdfs/Guideline-CAUTI-H.pdf"}],"hash":"3fa81bea"},{"id":"Q0639","spec":"nursing","type":"mcq","lang":"ar","q":"ادخل مريض عمرة ١٧ علما إلى القسم يشكو من فشل كلوي حاد من أهم الأعراض التي يشكو منها المريض عدم القدرة على التبول oliguria كم من الوقت يستغرق هذا المريض حتى يتمكن المريض من التبول مرة أخرى","qar":null,"options":["١ – ٢ يوم","٣ – ٧ يوم","٢ أسبوع","٣ - ٤ أسبوع"],"ans":2,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"المدة غير محدودة بدقة في المراجع: AMBOSS يذكر طور قلة البول 1–3 أسابيع وويكيبيديا تذكر تعافي ATN خلال 7–21 يومًا، لذلك أسبوعان أقرب من 3–7 أيام، لكن الكتب التمريضية تختلف في الرقم (السؤال فيه خطأ نسخ أيضًا). ثقة منخفضة.","src_disagrees":true,"refs":[{"t":"Acute kidney injury (AMBOSS)","u":"https://www.amboss.com/us/knowledge/acute-kidney-injury"},{"t":"Acute tubular necrosis (Wikipedia)","u":"https://en.wikipedia.org/wiki/Acute_tubular_necrosis"},{"t":"Acute Kidney Injury (Merck Manual Professional Edition)","u":"https://www.merckmanuals.com/professional/nephrology/acute-kidney-injury/acute-kidney-injury-aki"}],"hash":"edd411e9"},{"id":"Q0641","spec":"nursing","type":"mcq","lang":"ar","q":"بعد إجراء عملية زراعة الكلى للمريض أول ما يجب تقييمه بعد العملية هو","qar":null,"options":["توازن السوائل والأملاح المعدنية في الجسم","حدوث انتانات عند المريض","تقييم غازات الدم","تقييم ارتفاع درجة الحرارة"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"لم أجد مرجعًا يحدد أول ما يُقيَّم بعد زراعة الكلى؛ تمريضيًا الأولوية لمراقبة البول وتوازن السوائل والشوارد لأن أداء الطعم وخطر الإنتان والرفض يلحقان لاحقًا، وStatPearls يذكر قلة البول المفاجئة علامة على خلل الطعم. ثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Kidney Transplantation - StatPearls (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/books/NBK567755/"}],"hash":"e6674b1b"},{"id":"Q0643","spec":"nursing","type":"mcq","lang":"ar","q":"في بداية الدوام الصباحي ( الشفت الصباحي ) تم عمل تروية للمثانة للمريض بإدخال سائل التروية ٢٤٠٠ مل وفي نهاية (الشفت ) تم تسجيل السوائل المطروحة فوجدت ٢٩٠٠ مل احسب كمية البول المطروحة في الشفت الصباحي .","qar":null,"options":["٥٣٠٠ مل","٢٩٠٠ مل","٢٤٠ مل","٥٠٠ مل"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"بول المريض الفعلي = إجمالي السائل المطروح − سائل السقاية المُدخل = 2900 − 2400 = 500 مل. حساب مباشر؛ لم أجد صفحة تنص على الصيغة فثقة متوسطة (الرابط للسياق فقط ولا يذكر الحساب).","src_disagrees":false,"refs":[{"t":"Transurethral resection of the prostate (Wikipedia)","u":"https://en.wikipedia.org/wiki/Transurethral_resection_of_the_prostate"}],"hash":"2edfc011"},{"id":"Q0733","spec":"nursing","type":"mcq","lang":"en","q":"Sources Vitamin D is found in :","qar":null,"options":["Liver","egg's Yellow","Liver oils","cheese"],"ans":1,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"السؤال معيب لأن أكثر من خيار مصدر لفيتامين D: أغنى مصدر هو زيت كبد الحوت (الخيار «Liver oils») ثم الأسماك الدهنية، والبيض (صفار البيض) والكبد يحويان كميات أقل، والجبن قليل جداً. علامة المصدر «صفار البيض» مصدر صحيح لكنها ليست الأغنى، فالثقة منخفضة.","src_disagrees":false,"refs":[{"t":"NIH ODS - Vitamin D Fact Sheet for Health Professionals","u":"https://ods.od.nih.gov/factsheets/VitaminD-HealthProfessional/"}],"hash":"f1947edb"},{"id":"Q0734","spec":"nursing","type":"mcq","lang":"en","q":"The nurse positions the client sitting upright during palpation of which area?","qar":null,"options":["Abdomen","Genitals","Breast","Head and neck"],"ans":3,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"الرأس والرقبة تُفحصان في وضع الجلوس المنتصب (وهو المتوقع في الاختبارات)، لكن الثدي أيضاً يبدأ فحصه بالجلوس ثم الاستلقاء، أما البطن فمستلقياً؛ فالسؤال ملتبس ولا مرجع صريح يحسم «الرأس والرقبة»، لذا الثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Stanford Medicine 25 - Breast Exam (patient positioning)","u":"https://med.stanford.edu/stanfordmedicine25/the25/BreastExam.html"},{"t":"Nursing Skills (NCBI Bookshelf) - Head and Neck Assessment","u":"https://www.ncbi.nlm.nih.gov/books/NBK593205/"}],"hash":"36172394"},{"id":"Q0740","spec":"nursing","type":"mcq","lang":"en","q":"P.,C.mean;","qar":null,"options":["After meal.","Between meal.","Before meal.","Before bed time"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الاختصار p.c. من اللاتينية post cibum أي «بعد الوجبة» (وa.c. = قبل الوجبة)؛ المرجع موقع دوائي عام لا دليل سريري.","src_disagrees":false,"refs":[{"t":"Drugs.com - Top 150 Prescription Abbreviations & Medical Meanings","u":"https://www.drugs.com/article/prescription-abbreviations.html"}],"hash":"be5fe970"},{"id":"Q0743","spec":"nursing","type":"tf","lang":"en","q":"neurogenic shock most cause of surgery","qar":null,"options":["True","False"],"ans":1,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"الصياغة مشوّهة (source_typo)؛ إن كان المقصود «أشيع أسباب الصدمة العصبية هو الجراحة» فهي خاطئة لأن السبب الأشيع تقريباً دائماً إصابة الحبل الشوكي (رضّ)، وتُذكر التخدير النخاعي/فوق الجافية سبباً أقل شيوعاً. ثقة منخفضة بسبب تشوّه النص.","src_disagrees":false,"refs":[{"t":"Cleveland Clinic - Neurogenic Shock","u":"https://my.clevelandclinic.org/health/diseases/22175-neurogenic-shock"}],"hash":"1ec328b5"},{"id":"Q0749","spec":"nursing","type":"tf","lang":"en","q":"Yellow wounds are the color of normal granulation tissue and are in the proliferative phase of wound repair","qar":null,"options":["True","False"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"خطأ: النسيج التحبّبي السليم أحمر/وردي في مرحلة التكاثر، أما الجرح الأصفر فيدل على القشرة الليفية (slough) المرتبطة بالالتهاب وتحتاج إزالة (نظام ألوان أحمر-أصفر-أسود).","src_disagrees":false,"refs":[{"t":"WRHA Wound Care - Tissue Types in Wound Bed (2024)","u":"https://professionals.wrha.mb.ca/files/Tissue-Types-in-Wound-Bed-2024.pdf"}],"hash":"ac049393"},{"id":"Q0751","spec":"nursing","type":"mcq","lang":"en","q":"Post-oper ماذكر صحيح"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الموت السريري توقف الدورة الدموية والتنفس وهو حالة قابلة للانعكاس نظريًا بالإنعاش، أما موت خلايا الدماغ فهو الموت البيولوجي غير الرجعي؛ المرجع المتاح عام (ويكيبيديا) فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Clinical death (Wikipedia)","u":"https://en.wikipedia.org/wiki/Clinical_death"}],"hash":"b2ef31be"},{"id":"Q0832","spec":"nursing","type":"mcq","lang":"ar","q":"كل هذه أماكن لجس النبض ماعدا","qar":null,"options":["القلب","الزند","Radial","Carotid"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"مواضع جسّ النبض الشائعة (StatPearls): الكعبري والعضدي والفخذي والمأبضي والظنبوبي الخلفي وظهر القدم والسباتي؛ أما القلب فيُقاس نبضه القمّي بالسماعة لا بالجس، و«الزند» قد يقصد به الرسغ (موضع النبض الكعبري) أو الشريان الزندي. السؤال ملتبس وأرجّح «القلب» كمستثنى لكن دون حسم.","src_disagrees":false,"refs":[{"t":"Peripheral Pulse - StatPearls - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK542175/"}],"hash":"86dae265"},{"id":"Q0833","spec":"nursing","type":"mcq","lang":"ar","q":"من الاجراءات التمريضية لمريض يعاني من قصور القلب وضيق التفس","qar":null,"options":["اعطاء مورفين","رفع السرير 35-45 درجة","زيادة السوائل عن طريق الوريد","جميع ما ذكر صحيح"],"ans":1,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"رفع الرأس لوضع فاولر (نحو 30–45 درجة فأكثر) إجراء تمريضي معياري لتخفيف ضيق النفس، أما زيادة السوائل الوريدية فمضرّة في فشل القلب (العلاج يركّز على إزالة السوائل وتقليل الملح) فخيار «جميع ما ذكر» مرفوض؛ المورفين قد يُستخدم طبيًّا في الوذمة الرئوية الحادة فقد يقصده واضع السؤال، وغياب نص تمريضي صريح يجعل الحسم منخفض الثقة.","src_disagrees":false,"refs":[{"t":"Fowler's position (Wikipedia)","u":"https://en.wikipedia.org/wiki/Fowler%27s_position"},{"t":"Heart Failure: treatment (NHLBI, NIH)","u":"https://www.nhlbi.nih.gov/health/heart-failure/treatment"},{"t":"Pulmonary Edema - StatPearls (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/books/NBK557611/"}],"hash":"4c9a371b"},{"id":"Q0836","spec":"nursing","type":"mcq","lang":"ar","q":"من الاعراض التي تصاحب الكسور","qar":null,"options":["ورم وارتفاع في درجة حرارة العضو المصاب","ورم وانخفاض في درجة حرارة العضو المصاب","عدم الاحساس في العضو المصاب","جميع ماذكر صحيح"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"المراجع (MedlinePlus وOrthoInfo) تذكر الألم والتورم والكدمات والتشوه وفقد الحركة ولا تنص على حرارة الطرف؛ وكتاب Open RN يذكر تغيّر لون/حرارة الجلد وتنميلًا عند اعتلال الأعصاب/الأوعية. «جميع ما ذكر» غير مرجّح لأن الخيارين 0 و1 متناقضان (ارتفاع مقابل انخفاض الحرارة)، والأرجح عُرفًا الخيار 0 (تورم مع حرارة التهابية موضعية) لكن الحسم غير مؤكد.","src_disagrees":false,"refs":[{"t":"Fractures - MedlinePlus","u":"https://medlineplus.gov/fractures.html"},{"t":"Fractures (Broken Bones) - OrthoInfo","u":"https://www.orthoinfo.org/diseases--conditions/fractures-broken-bones"},{"t":"Chapter 10 Musculoskeletal System Alterations - Health Alterations (Open RN) - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK613072/"}],"hash":"af7873b9"},{"id":"Q0840","spec":"nursing","type":"mcq","lang":"ar","q":"قبل البدء بإعطاء الغذاء عن طريق الإنبوب الأنفي(N.G.T) يجب عمل الأتي","qar":null,"options":["إعطاء المريض ماء للشرب مع وضع السماعة على منطقة المعده","وضع ماء في الإنبوب قبل البدء بالتغذية","وضع الأنبوب في ماء لمشاهدة الفقاعات","( 1 و 3 )"],"ans":3,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"المقصود غالبًا التحقق من موضع الأنبوب قبل التغذية، والإجابة المتوقعة من الكتب القديمة «1 و3» (الإصغاء + فقاعات الماء). لكن الإرشادات الحديثة تعدّ الإصغاء (whoosh test) غير موثوق وتوصي بالأشعة أو قياس pH للسائل المسحوب، ولا يوجد مرجع يدعم اختبار الفقاعات؛ فالخيار 3 هو الأقرب لمفتاح الكتاب القديم لا للممارسة الحالية.","src_disagrees":false,"refs":[{"t":"Chapter 5 Insert Nasogastric and Feeding Tubes - Nursing Advanced Skills (Open RN) - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK594494/"},{"t":"Nasogastric Tube Insertion - StatPearls - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK556063/"},{"t":"Evidence-based strategies to prevent enteral nutrition complications - American Nurse","u":"https://www.myamericannurse.com/evidence-based-strategies-to-prevent-enteral-nutrition-complications/"}],"hash":"7bcf9ba9"},{"id":"Q0841","spec":"nursing","type":"mcq","lang":"ar","q":"أفضل منطقة لأخذ الحرارة من طفل حديث الولادة","qar":null,"options":["الفم","الإبط","الشرج"],"ans":1,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"WHO وNHS يعتمدان الإبط لقياس حرارة الوليد/الرضيع لأمانه وسهولته (يعطي تقديرًا جيدًا للحرارة المركزية)، والفم غير مناسب للوليد؛ لكن AAP يرى الشرج الأدق للرضع دون 3 أشهر (وWHO نفسه يذكر أن الشرج أدق عند الاشتباه بانخفاض الحرارة)، فالإرشادات تختلف. الإبط هو الجواب الشائع في بنوك التمريض والأقرب لتوصية WHO/NHS.","src_disagrees":false,"refs":[{"t":"Thermal protection of the newborn: a practical guide - WHO","u":"https://apps.who.int/iris/bitstream/handle/10665/63986/WHO_RHT_MSM_97.2.pdf"},{"t":"How to take your baby's temperature - NHS","u":"https://www.nhs.uk/conditions/baby/health/how-to-take-your-babys-temperature/"},{"t":"How to Take a Child's Temperature - HealthyChildren.org (AAP)","u":"https://www.healthychildren.org/English/health-issues/conditions/fever/Pages/How-to-Take-a-Childs-Temperature.aspx"}],"hash":"915148d9"},{"id":"Q0843","spec":"nursing","type":"mcq","lang":"ar","q":"مدة الحمل الطبيعية هي","qar":null,"options":["36 أسبوع","37 أسبوع","38 أسبوع"],"ans":2,"status":"tentative","conf":"low","tier":"strong","why":["tentative","override"],"note":"نزّلتُه إلى غير مؤكد: الخيارات المنقولة (36/37/38 أسبوعًا) لا تتضمن 40 أسبوعًا وهو الجواب المعتاد لمدة الحمل الطبيعية، فالأرجح أن الخيارات مبتورة في المصدر؛ 38 أسبوعًا هو الأقرب لمدة الحمل من الإخصاب (266 يومًا) فقط. مدة الحمل من الانغراس/الإخصاب 266 يومًا (≈38 أسبوعًا)، وتُحسب 280 يومًا (40 أسبوعًا) من أول يوم لآخر دورة؛ ولا يتضمن السؤال 40 أسبوعًا، فأقرب خيار للمدة الفعلية هو 38 أسبوعًا. أما 37 أسبوعًا فهو بداية «الحمل المبكر المكتمل» لا المدة الطبيعية. الصياغة ملتبسة (لم يحدد مبدأ العدّ).","src_disagrees":false,"refs":[{"t":"Physiology, Pregnancy - StatPearls - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK559304/"}],"hash":"11df0751"},{"id":"Q0856","spec":"nursing","type":"mcq","lang":"ar","q":"كلمة (QID) تعني","qar":null,"options":["أربع مرات باليوم","ثلاث مرات باليوم","مرتين باليوم"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"QID اختصار اللاتينية quater in die أي أربع مرات يوميًا (وTID ثلاث مرات وBID مرتين). المرجع المسترجع عام (ويكيبيديا) لذا تبقى الثقة متوسطة، والمعنى متفق عليه في الصيدلة.","src_disagrees":false,"refs":[{"t":"List of abbreviations used in medical prescriptions - Wikipedia","u":"https://en.wikipedia.org/wiki/List_of_abbreviations_used_in_medical_prescriptions"}],"hash":"29825dce"},{"id":"Q0862","spec":"nursing","type":"mcq","lang":"ar","q":"ماهو اول جزء يقيم للمريض بعد اخذ العلامات الحيويه ؟","qar":null,"options":["معدل الوعي","الجلد","سماع صوت الرئه"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"لا مرجع موحّد لهذا الترتيب؛ في قائمة فحص الرأس-القدم (Open RN) يأتي بعد العلامات الحيوية وتقييم الألم تقييمُ الجهاز العصبي ومستوى الوعي قبل الجلد والرئتين، لكن الترتيب عُرفي (قد تُقدَّم الرئتان في نهج ABC أو يبدأ المسح العام بالمظهر/الجلد)، فالحسم غير مؤكد.","src_disagrees":false,"refs":[{"t":"Appendix C – Head-to-Toe Assessment Checklist - Nursing Skills (Open RN) - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK596715/"}],"hash":"9bf62f71"},{"id":"Q0863","spec":"nursing","type":"mcq","lang":"ar","q":"ماهو التحليل اللذي يجب عمله في اي عملية جراحيه : -","qar":null,"options":["تحليل وظائف الكبد","تحليل وظائف الكلى","التجلد النزف"],"ans":2,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"قائمة Open RN لفحوص ما قبل الجراحة تضم ملف التخثر ووظائف الكلى والكبد جميعًا دون تمييز أيها «إلزامي لأي عملية»؛ وأقربها لكل جراحة هو اختبار التخثر/النزف لارتباطه المباشر بخطر النزف، وهو استنتاج عُرفي وليس نصًا صريحًا، والإرشادات الحديثة تجعل الفحوص انتقائية حسب الحالة. (الدائرة اليدوية في المصدر لم تُعتمد.)","src_disagrees":false,"refs":[{"t":"Chapter 2 Perioperative Care - Health Alterations (Open RN) - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK613066/"}],"hash":"eaf4f607"},{"id":"Q0864","spec":"nursing","type":"mcq","lang":"ar","q":"عند استخدام spinal anesthesia للمريض ماهي النقطه المهمه اللتي يجب ان تقيم في المريض قبل التخير ؟","qar":null,"options":["معدل السوائل في الجسم","التدخين","وظائف الحركه في الجسم"],"ans":2,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"نهاية السؤال مشوّهة (source_typo). StatPearls ينص على أن الفحص العصبي قبل الإجراء (قوة وإحساس الأطراف) ضروري للتقييم والتوثيق، كما يجعل نقص السوائل (hypovolemia) مضاد استطباب نسبيًا بسبب خطر هبوط الضغط؛ فالخياران 0 و2 مدعومان ولا يدعم أي مرجع التدخين. أرجّح الخيار 2 (وظائف الحركة) دون حسم.","src_disagrees":false,"refs":[{"t":"Spinal Anesthesia - StatPearls - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK537299/"}],"hash":"e7a72768"},{"id":"Q0866","spec":"nursing","type":"mcq","lang":"ar","q":"عند النتهاء من تقديم علاج فلورازيبام ( دالمين )30 ملجم عن طريق الفم اي من المقياس الآتيه يجب اتباعها لحماية المريض من الاعراض اللتي يسببها العلاج","qar":null,"options":["ربط اغطية السرير على المريض بشده","رفع جوانب السرير","وضع جرس الاستدعاء في متناول يد المريض","شرح الاعراض الجانبيه للمريض"],"ans":1,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"الفلورازيبام مهدئ منوّم يسبب دوخة ونعاسًا وترنحًا وسقوطًا (نشرة RxList)، والتدبير الوقائي بعد الجرعة في بنوك التمريض هو رفع جوانب السرير (ونظيره السؤال عن الديازيبام). لكن «جرس الاستدعاء في متناول اليد» ممارسة مقبولة أيضًا والممارسة الحديثة تقيّد استعمال الجوانب، فالحسم اصطلاحي. المرجع الداعم للإجراء ضعيف (Brainly).","src_disagrees":false,"refs":[{"t":"Dalmane (Flurazepam) - RxList","u":"https://www.rxlist.com/dalmane-drug.htm"},{"t":"Brainly: nurse gives a dose of diazepam - most important action (weak source)","u":"https://brainly.com/question/28188670"}],"hash":"ed72d17b"},{"id":"Q0867","spec":"nursing","type":"mcq","lang":"ar","q":"بعد ساعه من وضع الكمادات البلاستيكيه حول الالتواء اللذي حدث في مفصل الكاحل استدعاك المريض يشتكي من وخز خفيف وحقان في اصابع القدم , ماهو التصرف السليم في هذه الحاله ؟","qar":null,"options":["فحص او جس نبض الساق","اعادة ربط الرباط وتوسيعه","ترشد المريض لرفع القدم المصابه","تشجيع المريض بتحريك اصابعه كل ساعتين"],"ans":0,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"الوخز وتورم أصابع القدم بعد رباط ضاغط علامتان على ضعف الدورة/الأعصاب؛ Columbia Doctors: علامات شدّ الرباط الخدر والوخز والتورم أسفله و«يُرخى الرباط إذا شدّ». التسلسل التمريضي الأسلم: تقييم الحالة الوعائية العصبية (جس النبض) أولًا ثم إرخاء الرباط، فالخياران 0 و1 مقبولان وأرجّح 0 دون حسم.","src_disagrees":false,"refs":[{"t":"Rest, Ice, Compression, and Elevation (RICE) Information - Columbia Doctors","u":"https://www.columbiadoctors.org/health-library/article/rest-ice-compression-elevation-rice/"}],"hash":"f632b852"},{"id":"Q0871","spec":"nursing","type":"mcq","lang":"ar","q":"للعنايه بمريض اجريت له عملية هيموردوكتومي المقاييس المتبعه هي:","qar":null,"options":["استخدم انبوب اخراج للتقليل من الم الافرازات","تغيير ضمادات الجرح في منطقة العمليه","التشجيع على اخذ حمام دافئ","تقديم مسهل او ملين لتخفيف الالم اثناء الاخراج"],"ans":3,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"StatPearls: بعد استئصال البواسير يُتوقع ألم وامتلاء شرجي أسبوعًا، و«ضبط الألم واستعمال ملينات البراز أولوية» بعد العملية، كما يُثقَّف المريض على الحمامات الجلوسية (sitz baths)؛ فالخياران 2 (حمام دافئ) و3 (ملين لتخفيف ألم الإخراج) مدعومان وأرجّح 3 لنصّ «الأولوية» دون حسم، أما الخياران 0 و1 فغير مدعومين.","src_disagrees":false,"refs":[{"t":"Hemorrhoidectomy - StatPearls - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK549864/"}],"hash":"7ff7bfa2"},{"id":"Q0878","spec":"nursing","type":"mcq","lang":"ar","q":"امر الطبيب بـ 500 ملجم مضاد حيوي augmenten عليك ان تقدمه آمنا للمريض:","qar":null,"options":["500جم","0.5 جم","0.05 جم","0.005 جم"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"1 جرام = 1000 ملجم (milli = 10^-3)، فـ500 ملجم = 0.5 جم (NIST).","src_disagrees":false,"refs":[{"t":"Metric (SI) Prefixes - NIST","u":"https://www.nist.gov/pml/owm/metric-si-prefixes"}],"hash":"1e667331"},{"id":"Q0880","spec":"nursing","type":"mcq","lang":"ar","q":"خضع مريض لأخذ عينه للسائل العصبي من ظهره وبعد انتهاء العمليه طلبت منه البقاء على ظهره . كيف ستجيب على المريض اذا ما سألك عن سبب بقاءه على ظهره لعدة ساعات؟","qar":null,"options":["لن تتعرض للوقوع ان لزمت الهدوء اليوم","يسهل على الممرض ان يفحص اي مضاعفات في هذا الوضع","هذا الوضع يمنع حدوث نزيف من منطقة اخذ العينه","هذا الوضع يسمح لاعادة التأقلم في الضغط حول الدماغ"],"ans":3,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"التفسير التمريضي التقليدي للاستلقاء بعد البزل القطني هو السماح بإعادة استقرار ضغط السائل الدماغي الشوكي ومنع صداع ما بعد البزل، وهو الخيار الوحيد المتسق مع ذلك (بقية الخيارات لا أساس لها). لكن مراجعة كوكرين تبيّن أن الراحة في السرير لا تمنع الصداع (بل قد تزيده)، لذا الإجابة تتبع المنهج التمريضي وليس الدليل الحديث؛ الثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Body position and intake of fluids for preventing headache after lumbar puncture (Cochrane Review CD009199)","u":"https://www.cochrane.org/evidence/CD009199_body-position-and-intake-fluids-preventing-headache-after-lumbar-puncture"},{"t":"Lumbar puncture - NHS","u":"https://www.nhs.uk/tests-and-treatments/lumbar-puncture/"}],"hash":"7dc85b95"},{"id":"Q0881","spec":"nursing","type":"mcq","lang":"ar","q":"المنطقه الافضل لفحص امكانية حدوث الاستسقاء هي:","qar":null,"options":["اليد","الركبه","البطن","منطقة الحوض sacrum"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الوذمة (الاستسقاء) الانتقالية تظهر في المريض الماشي عند الكاحلين، أما المريض طريح الفراش فتتجمع في منطقة العجز (sacrum) بفعل الجاذبية، فهي أفضل موضع للفحص (يُفترض أن المقصود مريض ملازم للسرير؛ والبطن خاص بالاستسقاء البطني Ascites).","src_disagrees":false,"refs":[{"t":"Peripheral oedema - Patient.info (professional reference)","u":"https://patient.info/doctor/history-examination/peripheral-oedema"}],"hash":"d9bc4319"},{"id":"Q0882","spec":"nursing","type":"mcq","lang":"ar","q":"المريض اللذي يتلقى كميه كبيره من الاوكسجين معرض للتسمم بالاوكسجين , اي من الملاحظات الاتيه يجب وضعها في الاعتبار","qar":null,"options":["تشتت الافكار","فقد النظر","زيادة وبطئ التنفس","انقباضات العضلات"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"سُمّية الأكسجين تظهر رئويًا (ألم خلف القص، سعال، ضيق نفس) ومركزيًا (ارتباك/توهان، دوخة، غثيان، اضطراب رؤية، ارتعاش عضلي، تشنجات)؛ فالخياران الأول (التوهان) والرابع (الارتعاش العضلي) كلاهما وارد بحسب المرجع ولا يوجد خيار رئوي، لذلك لا يمكن الحسم. التخمين: الارتباك/تشتت الفكر كعلامة مبكرة؛ الثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Oxygen Toxicity - StatPearls - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK430743/"}],"hash":"0096a2f3"},{"id":"Q0885","spec":"nursing","type":"mcq","lang":"ar","q":"اي من الاعراض التاليه يحدث بسبب زيادة افراز هرمون الفازوبريسين vasopressin","qar":null,"options":["مرض زيادة افراز الغده الدرقيه","مرض الافراط في التبول","نقص في افراز هرمون الادرينالين","خلل في افراز الهرمون المعيق للتبول"],"ans":3,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"السؤال مترجَم بشكل مضطرب: فرط إفراز الفازوبريسين (ADH) يسبب متلازمة الإفراز غير الملائم SIADH (احتباس ماء ونقص صوديوم)، وهذا أقرب لخيار «خلل في إفراز الهرمون المعيق للتبول»؛ أما «الإفراط في التبول» (السكري الكاذب) فينتج عن نقص ADH لا زيادته، والخياران الأول والثالث لا علاقة لهما. أفضل تخمين مع ضعف الثقة بسبب ركاكة الصياغة.","src_disagrees":false,"refs":[{"t":"Syndrome of Inappropriate Antidiuretic Hormone Secretion - StatPearls - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/books/NBK507777/"}],"hash":"12acecb2"},{"id":"Q0887","spec":"nursing","type":"mcq","lang":"en","q":"kidney stone is classification as the","qar":null,"options":["Emergency surgery","Required surgery","Urgent surgery","All above is correct"],"ans":2,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"السؤال يتبع التصنيف التمريضي الخماسي لإلحاح الجراحة (طارئة/عاجلة/مطلوبة/اختيارية/اختيارية تجميلية)؛ وبحسب جدول Brunner & Suddarth (من الذاكرة ولم أتمكن من فتحه) تُصنَّف حصى الكلى/الحالب كجراحة عاجلة Urgent (خلال 24–30 ساعة). المرجعان المرفقان يعرّفان فئة «العاجلة» ويبيّنان أن الحصى تُعالَج عاجلًا عند المضاعفات واختياريًا عند غيرها، ولا يذكران الحصى صراحةً في التصنيف؛ لذلك الثقة منخفضة.","src_disagrees":false,"refs":[{"t":"26.1 Overview of the Surgical Experience - Medical-Surgical Nursing (OpenStax)","u":"https://openstax.org/books/medical-surgical-nursing/pages/26-1-overview-of-the-surgical-experience"},{"t":"Ureterolithiasis - StatPearls - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK560674/"}],"hash":"36cb3b68"},{"id":"Q0890","spec":"nursing","type":"mcq","lang":"en","q":"The client is unresponsive and requires total care by nursing staff. Which assessment doe the nurse check first before providing special oral care to the client :","qar":null,"options":["Presence of pain","Condition of the skin","Gag reflex","Range of motion"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"قبل العناية الفموية لمريض فاقد الوعي يُقيَّم منعكس التقيؤ (Gag reflex) لمعرفة خطر الاستنشاق، ثم يُوضَع المريض على جانبه؛ المراجع المتاحة مواد تعليمية تمريضية (وليست إرشادًا رسميًا) لذا الثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Oral Care for Unconscious-Dependent Patient - SaralMind Nursing","u":"https://www.saralmind.com/nursing/pcl-nursing/pcl-1st-year/fundamentals-of-nursing/nursing-measures-related-to-physical-needs-of-the-patient/oral-care-for-unconscious-dependent-patient"},{"t":"Providing Oral Care for the Unconscious Patient - CliffsNotes","u":"https://www.cliffsnotes.com/study-notes/29088668"}],"hash":"1f013922"},{"id":"Q0891","spec":"nursing","type":"mcq","lang":"en","q":"In Maslows hierarchy of physiologic needs, the human need of greatest p:","qar":null,"options":["nutration","Oxygen","Elimination","Love"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الحاجات الفسيولوجية هي قاعدة هرم ماسلو وتُلبّى أولًا، وأولوية الأكسجين/الهواء بينها هي الأعلى لأن الحياة لا تستمر دقائق بدونه (قبل الغذاء والإخراج؛ والحب حاجة أعلى في الهرم). النص مبتور («greatest p» = priority). المراجع تثبت أولوية الحاجات الفسيولوجية وتذكر الهواء أولًا، ولا تُرتّب الأكسجين صراحةً فوق الغذاء.","src_disagrees":false,"refs":[{"t":"Maslow's hierarchy of needs - Wikipedia","u":"https://en.wikipedia.org/wiki/Maslow%27s_hierarchy_of_needs"},{"t":"1.07 Maslow's Hierarchy of Needs - Nursing Fundamentals I (Brookside Press)","u":"https://brooksidepress.org/nursing_fundamentals_1/?page_id=132"}],"hash":"26e8f391"},{"id":"Q0893","spec":"nursing","type":"mcq","lang":"en","q":"The main extracellular cation is:","qar":null,"options":["sodium.","magnesium.","potassium.","calcium."],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الصوديوم هو الكاتيون الرئيسي في السائل خارج الخلوي، أما البوتاسيوم فهو الكاتيون الرئيسي داخل الخلوي.","src_disagrees":false,"refs":[{"t":"26.3 Electrolyte Balance - Anatomy and Physiology 2e (OpenStax)","u":"https://openstax.org/books/anatomy-and-physiology-2e/pages/26-3-electrolyte-balance"}],"hash":"85219f32"},{"id":"Q0894","spec":"nursing","type":"mcq","lang":"en","q":"Back care is best describe as:","qar":null,"options":["Washing of the back","Caring for the back by means of massage","Application of cold compress at the back","Application of hot compress at the back"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"تُعرَّف العناية بالظهر (Back care) في التمريض بأنها تدليك/فرك الظهر بحركات إيقاعية لتنشيط الدورة الدموية والوقاية من قرحات الضغط وتقييم الجلد؛ وليست مجرد غسل أو كمادات. المرجع مادة تمريضية تعليمية فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Back Care - SaralMind Nursing","u":"https://www.saralmind.com/nursing/pcl-nursing/pcl-1st-year/fundamentals-of-nursing/nursing-measures-related-to-physical-needs-of-the-patient/back-care"}],"hash":"6963507d"},{"id":"Q0896","spec":"nursing","type":"mcq","lang":"en","q":"When caring for a single client during one shift, it is appropriate for the health care provider to reuse only which of the following personal protective equipment :","qar":null,"options":["Clean gloves","Surgical mask","Gown","Goggles"],"ans":3,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"القفازات تُستخدم لمرة واحدة ولا يُعاد استعمالها، والمريلة (Gown) تُبدَّل عند تلوثها، أما النظارات الواقية (Goggles) فهي الوحيدة القابلة لإعادة الاستخدام بعد التنظيف والتطهير، وهذا أرجح المفتاح التمريضي. لم أتمكن من الوصول إلى نص مرجعي صريح (قد يختلف الحكم لو اعتُمد الاستخدام الممتد للكمامة الجراحية لمريض واحد)، لذا الثقة منخفضة.","src_disagrees":false,"refs":[],"hash":"e8d65c40"},{"id":"Q0897","spec":"nursing","type":"mcq","lang":"en","q":"A client has a pressure ulcer with a shallow. partial skin thickness, eroded necrotic areas. The physician assistant would treat the area with which dressing:","qar":null,"options":["Alginate","Dry gauze","Hydrocolloid","No dressing is indicated"],"ans":2,"status":"verified","conf":"medium","tier":"strong","why":["corrected"],"note":"علامة المصدر (الشاش الجاف) غير صحيحة: التئام الجروح يحتاج بيئة رطبة؛ وللقرحة السطحية جزئية السماكة (المرحلة 2) يُختار ضماد تفاعلي مثل الهيدروكولويد، بينما الشاش الجاف سلبي لاصق يؤذي الأنسجة، والألجينات لكثرة الإفراز، ولا يصحّ «لا ضماد». نص السؤال مشوّه («eroded necrotic areas») والأدلة الكوكرينية محدودة فالثقة متوسطة.","src_disagrees":true,"refs":[{"t":"NICE (NCBI Bookshelf) - Dressings, in Prevention and Management of Pressure Ulcers","u":"https://www.ncbi.nlm.nih.gov/books/NBK333129/"},{"t":"StatPearls - Pressure Ulcer","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK553107/"},{"t":"Cochrane (PMC) - Dressings and topical agents for treating pressure ulcers","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6481609/"}],"hash":"701148ac"},{"id":"Q0901","spec":"nursing","type":"mcq","lang":"en","q":"A client who describes his Pain as 7 on a scale of 0 to 10 is classified Following?","qar":null,"options":["Mild Pain","No Pain","Moderate Pain","Sever Pain"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"على مقياس الألم الرقمي 0–10 التصنيف المعتمد: 1–3 خفيف، 4–6 متوسط، 7–10 شديد؛ فالدرجة 7 = ألم شديد (تختلف بعض الدراسات في الحدود لكن 7–10 هو النطاق الأكثر اعتمادًا).","src_disagrees":false,"refs":[{"t":"0–10 Numeric Rating Scale - Washington State DSHS","u":"https://www.dshs.wa.gov/sites/default/files/ALTSA/stakeholders/documents/duals/toolkit/Numeric%20Rating%20Pain%20Scale.pdf"},{"t":"Exploring Established Cut-Off Points for Pain Levels in the Numeric Rating Scale - Pain Management Nursing 2025","u":"https://www.sciencedirect.com/science/article/pii/S1524904225002486"}],"hash":"e7763fb0"},{"id":"Q0905","spec":"nursing","type":"mcq","lang":"en","q":"Signs and symptoms of hypovolemic shock","qar":null,"options":["blood loss","Emotional distress","Severe allergic reaction","All of Above"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"الصياغة مضطربة: الخيارات هي أسباب وليست أعراضًا. الصدمة نقص الحجم تنتج عن فقد الدم/السوائل فقط؛ الضائقة النفسية (عصبية/إغماء) والحساسية المفرطة (توزيعية/تأقية) ليستا من أسبابها. إن كان المقصود «أسباب الصدمة عمومًا» فقد يكون المفتاح «كل ما سبق»، لذا الثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Hypovolemia and Hypovolemic Shock - StatPearls - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK513297/"}],"hash":"eaecadd1"},{"id":"Q0908","spec":"nursing","type":"mcq","lang":"en","q":"Pt needed blood Type B give","qar":null,"options":["B or O","A or B","A or AB","B or AB"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"مريض فصيلته B يستقبل كريات حمراء من فصيلة B أو O (افتراض أن المقصود الدم/الكريات الحمراء)؛ الفصيلتان A وAB تحتويان مستضد A فلا تناسبان. (لو كان المقصود البلازما لانعكس الأمر: B أو AB).","src_disagrees":false,"refs":[{"t":"Blood Types Explained - A, B, AB and O - Red Cross Blood Services","u":"https://www.redcrossblood.org/donate-blood/blood-types.html"}],"hash":"3a78b45d"},{"id":"Q0917","spec":"nursing","type":"mcq","lang":"en","q":"Clients should be taught that repeatedly ignoring the sensation of needing to defecate result in which of the following?","qar":null,"options":["Constipation","Diarrhea","Incontinence","Hemorrhoids"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"تجاهل الرغبة في التبرز بشكل متكرر يُعدّ سببًا معروفًا للإمساك (يجف البراز ويتصلب)؛ والإمساك هو النتيجة المباشرة المقصودة (البواسير قد تنشأ لاحقًا من الإجهاد). النص مبتور قليلًا لكن الخيارات كاملة.","src_disagrees":false,"refs":[{"t":"Constipation - Johns Hopkins Medicine","u":"https://www.hopkinsmedicine.org/health/conditions-and-diseases/constipation"}],"hash":"6f0b544a"},{"id":"Q0921","spec":"nursing","type":"mcq","lang":"en","q":"Liver is located in the:","qar":null,"options":["Right upper quadrant","Right lower quadrant","Left lower quadrant","Left upper quadrant"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"الكبد يقع في الربع العلوي الأيمن من البطن تحت الحجاب الحاجز وتحمي معظمه الأضلاع السفلية اليمنى.","src_disagrees":false,"refs":[{"t":"Liver: Where It's Located, Function & Anatomy - لذا الثقة منخفضة.","src_disagrees":false,"refs":[],"hash":"0e2c3f42"},{"id":"Q0928","spec":"nursing","type":"mcq","lang":"en","q":"Most clients are comfortable when room temperature is","qar":null,"options":["20° to 32 °C","20° to 23°C","20° to 28°C","20° to 35°C"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"نطاق الراحة الحرارية الداخلي المعتاد نحو 20–24°م (توصية OSHA: 68–76°ف = 20–24.4°م) والمقرر التمريضي يذكر 20–23°م؛ أما 28 و32 و35°م فحارة وغير مريحة. النطاق 20–23 هو الخيار الوحيد المتوافق، والمرجع لبيئة المكاتب لا للمستشفيات لذا الثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Reiteration of Existing OSHA Policy on Indoor Air Quality: Office Temperature/Humidity - OSHA","u":"https://www.osha.gov/laws-regs/standardinterpretations/2003-02-24"}],"hash":"84e7dee6"},{"id":"Q0930","spec":"nursing","type":"tf","lang":"en","q":"Complete the agency's admission procedure usually performed by nursing personnel ( )","qar":null,"options":["True","False"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"صحيح: استكمال إجراءات القبول (الهوية/السوار والتوثيق) يقوم به عادةً طاقم التمريض كما في منهج أساسيات التمريض؛ المرجع المتاح شرائح تعليمية (ضعيف) لذا الثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Fundamental Nursing Skills and Concepts (slides, PowerShow) - weak source","u":"https://www.powershow.com/view/100856-ZWMyY/Fundamental_Nursing_Skills_and_Concepts_powerpoint_ppt_presentation"}],"hash":"3afcc2af"},{"id":"Q0933","spec":"nursing","type":"tf","lang":"en","q":"A good mattress adjusts to the shape of the body while supporting it ( )","qar":null,"options":["True","False"],"ans":0,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"العبارة تتفق مع المقرر التمريضي (المرتبة الجيدة تدعم الجسم وتتكيّف مع شكله لتوزيع الضغط)، لكن لم أتمكن من فتح مرجع يذكرها صراحةً، لذا الثقة منخفضة.","src_disagrees":false,"refs":[],"hash":"2895c78a"},{"id":"Q0934","spec":"nursing","type":"tf","lang":"en","q":"A wound is a disruption in the integrity of the body tissue that puts an individual at risk for infection ( )","qar":null,"options":["True","False"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"صحيح: الجرح = انقطاع في سلامة النسيج/الجلد مما يعرّض الفرد لخطر العدوى (تعريف كتب أساسيات التمريض؛ OpenStax يعرّفه بانقطاع سلامة الجلد أو النسيج)، وعبارة «خطر العدوى» من نص المنهج.","src_disagrees":false,"refs":[{"t":"OpenStax Fundamentals of Nursing - 24.3 Wound Classification","u":"https://openstax.org/books/fundamentals-nursing/pages/24-3-wound-classification"}],"hash":"d817070b"},{"id":"Q0935","spec":"nursing","type":"tf","lang":"en","q":"Hospital chairs are straight-backed to facilitate good postural support ( )","qar":null,"options":["True","False"],"ans":0,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"العبارة تتفق مع ما يُذكر في مقررات التمريض الأساسية (كراسي المستشفى ذات ظهر مستقيم لدعم وضعية الجلوس)، لكن لم أتمكن من فتح مرجع يذكرها صراحةً، لذا الثقة منخفضة.","src_disagrees":false,"refs":[],"hash":"7b7b93fa"},{"id":"Q0936","spec":"nursing","type":"tf","lang":"en","q":"Hospital beds usually remain in their lowest position when clients are receiving nursing care or during a change of bed linens ( )","qar":null,"options":["True","False"],"ans":1,"status":"tentative","conf":"low","tier":"general","why":["tentative"],"note":"كما هو مكتوب العبارة خاطئة: يُخفَض السرير عندما يكون المريض مستريحًا/دون مراقبة (AHRQ)، أما أثناء تقديم الرعاية أو تبديل الفراش فيُرفع إلى ارتفاع العمل المناسب لحماية ظهر الممرض. يُحتمل أن الأصل «تبقى في أدنى وضع ما عدا أثناء الرعاية…» وسقطت كلمة الاستثناء عند النقل، لذا الثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Preventing Falls in Hospitals: A Toolkit for Improving Quality of Care (AHRQ)","u":"https://www.ahrq.gov/sites/default/files/publications/files/fallpxtoolkit_0.pdf"},{"t":"Hospital bed - Wikipedia","u":"https://en.wikipedia.org/wiki/Hospital_bed"},{"t":"Care of environment - SaralMind Nursing","u":"https://www.saralmind.com/nursing/pcl-nursing/pcl-1st-year/fundamentals-of-nursing/measures-to-provide-safety/care-of-environment"}],"hash":"bef819a3"},{"id":"Q0937","spec":"nursing","type":"tf","lang":"en","q":"During the client admission, orientation help person become familiar with a new environment ( )","qar":null,"options":["True","False"],"ans":0,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"العبارة صحيحة: من إجراءات استقبال المريض تعريفه هو وأسرته بالجناح وروتينه والمرافق والسياسات ليتكيّف مع البيئة الجديدة. المرجع مادة تمريضية تعليمية فالثقة متوسطة.","src_disagrees":false,"refs":[{"t":"Introduction to Hospital Nursing (admission and orientation) - SaralMind Nursing","u":"https://www.saralmind.com/nursing/pcl-nursing/pcl-1st-year/fundamentals-of-nursing/introduction-to-hospital-nursing/introduction-to-hospital-nursing"}],"hash":"f79a387c"},{"id":"Q0939","spec":"nursing","type":"tf","lang":"en","q":"If medications prepared by another person you never administer it ( )","qar":null,"options":["True","False"],"ans":0,"status":"tentative","conf":"low","tier":"none","why":["tentative"],"note":"القاعدة التمريضية المعروفة: لا يُعطي الممرض دواءً حضّره شخص آخر (المسؤولية عن الدواء المُحضَّر تقع على من حضّره ويتحقق من هويته)، فالعبارة صحيحة على الأرجح؛ لم أتمكن من فتح مرجع ينص عليها، لذا الثقة منخفضة (وقد تُستثنى الأدوية المجهّزة من الصيدلية بوحدة الجرعة).","src_disagrees":false,"refs":[],"hash":"edb52db5"},{"id":"Q0940","spec":"nursing","type":"tf","lang":"en","q":"If a medication is withheld, indicate exact reason in the client's record ( )","qar":null,"options":["True","False"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"العبارة صحيحة على الأرجح: عند حجب/عدم إعطاء دواء يجب توثيق السبب في سجل المريض؛ ومرجع AHRQ يشير بشكل غير مباشر إلى أن توثيق الجرعات المحجوبة معيار متوقع (ويرصد أن نصفها فقط يُوثَّق) دون أن ينص على القاعدة حرفيًا، لذا الثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Medication Administration Safety - Patient Safety and Quality: An Evidence-Based Handbook for Nurses (AHRQ) - NCBI Bookshelf","u":"https://www.ncbi.nlm.nih.gov/books/NBK2656/"}],"hash":"defa760d"},{"id":"Q0449","spec":"midwifery","type":"mcq","lang":"ar","q":"تنتج المشيمة كل ما يلي باستثناء:","qar":null,"options":["الاستروجين","البروجسترون","لاكتوجين المشيمة البشري","الفيبرينوجين"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"المشيمة تنتج الإستروجين والبروجسترون وHCG وHPL (لاكتوجين المشيمة)، أما الفيبرينوجين فيصنعه الكبد.","src_disagrees":false,"refs":[{"t":"Placenta (Wikipedia)","u":"https://en.wikipedia.org/wiki/Placenta"},{"t":"Fibrinogen (Wikipedia)","u":"https://en.wikipedia.org/wiki/Fibrinogen"}],"hash":"acbc4ac7"},{"id":"Q0450","spec":"midwifery","type":"mcq","lang":"ar","q":"بطانة رحم الحامل هي","qar":null,"options":["عضلة الرحم","الغشاء الساقط","بطانة الرحم","الغلاف المحيط للرحم"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"بطانة الرحم أثناء الحمل تتحول إلى الغشاء الساقط (Decidua) الذي يشكّل الجزء الأمومي من المشيمة ويُطرح بعد الولادة.","src_disagrees":false,"refs":[{"t":"Decidua (Wikipedia)","u":"https://en.wikipedia.org/wiki/Decidua"}],"hash":"92862336"},{"id":"Q0451","spec":"midwifery","type":"mcq","lang":"ar","q":"يتكون الجزء السفلي من الرحم من:","qar":null,"options":["العنق الرحمي","القرنية","الجسم","البرزخ"],"ans":0,"status":"tentative","conf":"low","tier":"strong","why":["tentative"],"note":"السؤال غامض: تشريحيًا العنق هو الجزء السفلي من الرحم (Cervix)، بينما 'القطعة السفلية من الرحم' (Lower uterine segment) في الحمل تتكوّن من البرزخ (الخيار الرابع) حسب كتب التوليد. لم أجد مرجعًا يحسم صياغة السؤال؛ أُبقي الخيار الأول (العنق) مطابقًا لعلامة المصدر بثقة منخفضة.","src_disagrees":false,"refs":[{"t":"Cervix (Wikipedia)","u":"https://en.wikipedia.org/wiki/Cervix"},{"t":"Uterus (Wikipedia)","u":"https://en.wikipedia.org/wiki/Uterus"},{"t":"Anatomy of the uterus - StatPearls (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/books/NBK470297/"}],"hash":"416e9f13"},{"id":"Q0452","spec":"midwifery","type":"mcq","lang":"ar","q":"يحتوي السائل الأمنيوسي على ما يلي باستثناء:","qar":null,"options":["البروتين","بول الجنين","البكتيريا","بلازما"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"السائل الأمنيوسي يحوي بروتينات وبول الجنين ويُشتق أصلًا من بلازما الأم، والبكتيريا فيه حالة مرضية (التهاب المشيمة والسلى) وليست من مكوناته الطبيعية؛ فالاستثناء هو البكتيريا. ثقة متوسطة لأن المراجع لا تنص صراحة على تعقّمه.","src_disagrees":false,"refs":[{"t":"Amniotic fluid (Wikipedia)","u":"https://en.wikipedia.org/wiki/Amniotic_fluid"},{"t":"Chorioamnionitis (Wikipedia)","u":"https://en.wikipedia.org/wiki/Chorioamnionitis"}],"hash":"2b6b97e1"},{"id":"Q0453","spec":"midwifery","type":"mcq","lang":"ar","q":"مصطلح multigravida يعني:","qar":null,"options":["امرأة أجري لها عمليتا إجهاض","حامل للمرة الثانية أو الفرعية في التسلسل الزمني","امرأة حملت مرتين أو أكثر","أم لديها طفلان أو أكثر"],"ans":2,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"Multigravida هي المرأة التي حملت أكثر من مرة (مرتين فأكثر)، وليست من لديها طفلان (هذه multipara) ولا مجرد إجهاضين. الخيار الثاني ('حامل للمرة الثانية أو اللاحقة') قريب في المعنى لكن صياغته مشوّشة؛ فالثالث الأدق.","src_disagrees":false,"refs":[{"t":"Gravidity and parity (Wikipedia)","u":"https://en.wikipedia.org/wiki/Gravidity_and_parity"}],"hash":"b84f4a41"},{"id":"Q0454","spec":"midwifery","type":"mcq","lang":"ar","q":"النساء الحوامل لأول مرة تسمى: -","qar":null,"options":["multipara","prim gravida","grand multipara","multigravida"],"ans":1,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"Primigravida هي المرأة الحامل للمرة الأولى؛ أما multipara فهي من ولدت أكثر من مرة وgrand multipara من ولدت 5 مرات فأكثر وmultigravida حملت أكثر من مرة.","src_disagrees":false,"refs":[{"t":"Gravidity and parity (Wikipedia)","u":"https://en.wikipedia.org/wiki/Gravidity_and_parity"}],"hash":"1d23e875"},{"id":"Q0459","spec":"midwifery","type":"mcq","lang":"ar","q":"دلالة للاستشارة الوراثية هي: -","qar":null,"options":["مولود ميت أكثر من ثلاثة اطفال","الإجهاض التلقائي","سن ٣٥ أو أكثر والتفكير في الحمل","كل ما سبق"],"ans":3,"status":"verified","conf":"medium","tier":"general","why":["general"],"note":"من دواعي الاستشارة الوراثية: عمر الأم 35 سنة فأكثر عند الولادة، والإجهاضات المتكررة/وفيات الأجنة أو الرضّع غير المفسَّرة، والتاريخ العائلي؛ فخيار 'كل ما سبق' صحيح (صياغة الخيار الأول 'أكثر من ثلاثة أطفال' غير دقيقة لكن الفكرة ولادات ميتة متكررة).","src_disagrees":false,"refs":[{"t":"Genetic counseling - Wikipedia","u":"https://en.wikipedia.org/wiki/Genetic_counseling"}],"hash":"749f5418"},{"id":"Q0460","spec":"midwifery","type":"mcq","lang":"ar","q":"كل هذه الهرمونات تؤدي إلى غثيان الصباح بإستثناء: -","qar":null,"options":["البروجسترون","الاستروجين","ريلاكسين","هرمون المنبه للجريب FSH"],"ans":3,"status":"verified","conf":"medium","tier":"strong","why":["corrected"],"note":"المراجع تربط غثيان الحمل بهرمونات hCG والإستروجين والبروجسترون (تأخّر تفريغ المعدة وارتخاء المصرّة)، ولا تذكر FSH؛ فالبروجسترون ليس الاستثناء بل FSH هو الهرمون غير المرتبط بالغثيان (الريلاكسين غير مذكور في المرجع المسترجَع).","src_disagrees":true,"refs":[{"t":"Hyperemesis Gravidarum - StatPearls (NCBI Bookshelf)","u":"https://www.ncbi.nlm.nih.gov/sites/books/NBK532917/"}],"hash":"96db43bc"},{"id":"Q0461","spec":"midwifery","type":"mcq","lang":"ar","q":"أي من القراءات التالية يحتمل أن يزيد ارتفاع ضغط الدم خلال الثلث الثاني أو الثالث من الحمل:","qar":null,"options":["125/80mmhg","130/85mmhg","140/90mmhg","110/70mmhg"],"ans":2,"status":"verified","conf":"medium","tier":"strong","why":["corrected"],"note":"يُعرَّف ارتفاع ضغط الدم في الحمل بقراءة ≥140/90 ملم زئبق (NICE NG133)، وهي الوحيدة بين الخيارات التي تبلغ العتبة؛ أما 130/85 فدونها. صياغة السؤال غير واضحة ('يحتمل أن يزيد')، وأُفسِّرها بأنها '
