name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + test + security scan + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Security scan (forbidden APIs, secrets, CSP, https links)
        run: npm run scan
      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high
      - name: End-to-end tests (real Chrome)
        run: CHROME_PATH="$(which google-chrome)" npm run test:e2e
